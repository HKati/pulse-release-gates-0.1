name: Make OG image (1200x630)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source image path (tracked regular file in the selected main commit)"
        default: "hero_dark_4k.png"
        required: true
        type: string
      bgcolor:
        description: "Background color"
        default: "#000000"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: make-og-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      image_sha256: ${{ steps.image.outputs.image_sha256 }}
    steps:
      - name: Reject unauthorized dispatch before checkout
        shell: bash
        env:
          OG_AUTHORIZED: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                github.repository == 'HKati/pulse-release-gates-0.1' &&
                github.repository_id == '1061766508' &&
                github.repository_owner == 'HKati' &&
                github.repository_owner_id == '128643840' &&
                github.actor == 'HKati' && github.actor_id == '128643840' &&
                github.triggering_actor == 'HKati' &&
                github.ref == 'refs/heads/main' && github.ref_type == 'branch' &&
                github.workflow_ref == 'HKati/pulse-release-gates-0.1/.github/workflows/make_org.yml@refs/heads/main' &&
                github.workflow_sha == github.sha }}
        run: |
          set -euo pipefail
          if [ "$OG_AUTHORIZED" != "true" ]; then
            echo "::error::OG write rejected: unauthorized actor, repository, branch or workflow source."
            exit 1
          fi

      - name: Checkout exact authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify dispatch and checkout identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tools/make_og_write_boundary_v0.py preflight

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Pillow in read-only job
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "Pillow>=10,<12"

      - name: Generate bounded image candidate
        id: image
        shell: bash
        run: |
          set -euo pipefail
          python -I tools/make_og_write_boundary_v0.py generate --bundle "$RUNNER_TEMP/og-candidate"

      - name: Upload this attempt's image candidate
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: og-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/og-candidate/
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 1

  write_image:
    needs: generate
    if: >-
      ${{ needs.generate.result == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'HKati/pulse-release-gates-0.1' &&
          github.repository_id == '1061766508' &&
          github.repository_owner == 'HKati' &&
          github.repository_owner_id == '128643840' &&
          github.actor == 'HKati' && github.actor_id == '128643840' &&
          github.triggering_actor == 'HKati' &&
          github.ref == 'refs/heads/main' && github.ref_type == 'branch' &&
          github.workflow_ref == 'HKati/pulse-release-gates-0.1/.github/workflows/make_org.yml@refs/heads/main' &&
          github.workflow_sha == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      OG_ARTIFACT_ID: ${{ needs.generate.outputs.artifact_id }}
      OG_EXPECTED_SHA256: ${{ needs.generate.outputs.image_sha256 }}
    steps:
      - name: Checkout exact authorized writer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Recheck writer identity and candidate selection
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tools/make_og_write_boundary_v0.py preflight

      - name: Download exact candidate from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact_id }}
          path: ${{ runner.temp }}/og-candidate/
          merge-multiple: true
          digest-mismatch: error

      - name: Verify one-file commit and push to unchanged main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -I tools/make_og_write_boundary_v0.py write --bundle "$RUNNER_TEMP/og-candidate"
