name: Gravity decodability wall v0.2 (shadow)
on:
  pull_request:
    paths:
      - '.github/workflows/gravity_decodability_wall_v0_2_shadow.yml'
      - 'scripts/*gravity_record_protocol*'
      - 'schemas/*gravity_record_protocol*'
      - 'tests/test_gravity_decodability_wall_v0_2.py'
      - 'PULSE_safe_pack_v0/fixtures/*gravity_record_protocol*'
      - 'PULSE_safe_pack_v0/fixtures/decodability_wall_v0_2.demo.json'
      - 'out/gravity_record_protocol_inputs_v0_1.json'
      - 'docs/gravity_record_protocol_decodability_wall_v0_2.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gravity_decodability_wall_v0_2_shadow.yml'
      - 'scripts/*gravity_record_protocol*'
      - 'schemas/*gravity_record_protocol*'
      - 'tests/test_gravity_decodability_wall_v0_2.py'
      - 'PULSE_safe_pack_v0/fixtures/*gravity_record_protocol*'
      - 'PULSE_safe_pack_v0/fixtures/decodability_wall_v0_2.demo.json'
      - 'out/gravity_record_protocol_inputs_v0_1.json'
      - 'docs/gravity_record_protocol_decodability_wall_v0_2.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  requirement-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema==4.23.0' 'pytest==8.3.5'
      - run: python -m pytest -q tests/test_gravity_decodability_wall_v0_2.py
      - run: python scripts/check_gravity_record_protocol_decodability_wall_v0_2_contract.py --in PULSE_safe_pack_v0/fixtures/decodability_wall_v0_2.demo.json
