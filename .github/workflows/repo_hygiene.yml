name: repo-hygiene

on:
  pull_request: {}
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  hygiene_guardrails:
    runs-on: ubuntu-latest  
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pinned
        with:
          python-version: "3.11"

      - name: Install PyYAML (for workflow YAML guards)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pyyaml==6.0.2"

      - name: "Repo hygiene: enforce Python version sync (environment.yml vs workflows)"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          import yaml

          env = pathlib.Path("environment.yml")
          workflows = pathlib.Path(".github/workflows")
          version_re = re.compile(r"^\s*python-version\s*:\s*['\"]?([^'\"\n]+)", re.MULTILINE)

          data = yaml.safe_load(env.read_text(encoding="utf-8"))
          deps = data.get("dependencies", []) if isinstance(data, dict) else []

          env_version = None
          for dep in deps:
              if isinstance(dep, str) and dep.startswith("python="):
                  env_version = dep.split("=", 1)[1].strip()
                  break

          if not env_version:
              print("::error::No python=<version> dependency found in environment.yml")
              sys.exit(1)

          # Q2 refines the core 3.11 line to the reviewed exact patch target.
          # The acquisition workflow declares it once. Hosted intake refines
          # the existing pulse and tools-tests jobs; every other declaration stays exact.
          patch_pins = {
              ".github/workflows/q2_reference_acquisition_v0.yml": "3.11.16",
          }
          scoped_patch_pins = {
              ".github/workflows/pulse_ci.yml": {"pulse": "3.11.16", "tools-tests": "3.11.16"},
              ".github/workflows/q2_release_capsule_publication_v0.yml": {"build": "3.11.16", "verify_download": "3.11.16"},
          }

          missing_pins = []
          for pinned_path in (*patch_pins, *scoped_patch_pins):
              pinned_workflow = pathlib.Path(pinned_path)
              if pinned_workflow.is_symlink() or not pinned_workflow.is_file():
                  missing_pins.append(pinned_path)
          if missing_pins:
              for pinned_path in sorted(missing_pins):
                  print(f"::error file={pinned_path}::"
                        "Pinned workflow must exist as a regular file at its exact path.")
              sys.exit(1)

          mismatches = []
          for wf in sorted(workflows.glob("*.yml")) + sorted(workflows.glob("*.yaml")):
              text = wf.read_text(encoding="utf-8", errors="replace")
              declared_versions = [v.strip() for v in version_re.findall(text)]
              if wf.as_posix() in scoped_patch_pins:
                  job_pins = scoped_patch_pins[wf.as_posix()]
                  for patch_version in job_pins.values():
                      if patch_version.rsplit(".", 1)[0] != env_version:
                          mismatches.append((wf.as_posix(), patch_version,
                                             f"a patch pin on environment.yml line {env_version}"))
                  try:
                      document = yaml.load(text, Loader=yaml.BaseLoader)
                  except yaml.YAMLError:
                      document = None
                  jobs = document.get("jobs") if isinstance(document, dict) else None
                  if not isinstance(jobs, dict):
                      mismatches.append((wf.as_posix(), "invalid jobs", "a jobs mapping"))
                      continue
                  structured_versions = []
                  scoped_setups = {job_name: 0 for job_name in job_pins}
                  for job_name, job in jobs.items():
                      steps = job.get("steps") if isinstance(job, dict) else None
                      if not isinstance(steps, list):
                          mismatches.append((wf.as_posix(), str(job_name), "an explicit step list"))
                          continue
                      for step in steps:
                          if not isinstance(step, dict):
                              mismatches.append((wf.as_posix(), "invalid step", "a step mapping"))
                              continue
                          uses = step.get("uses", "")
                          setup = isinstance(uses, str) and uses.startswith("actions/setup-python@")
                          scoped = setup and job_name in job_pins
                          if scoped:
                              scoped_setups[job_name] += 1
                          parameters = step.get("with", {})
                          has_version = isinstance(parameters, dict) and "python-version" in parameters
                          if setup and not has_version:
                              mismatches.append((wf.as_posix(), str(job_name), "an explicit python-version"))
                          if has_version:
                              declared = parameters["python-version"]
                              structured_versions.append(declared)
                              expected = job_pins[job_name] if scoped else env_version
                              if declared != expected:
                                  mismatches.append((wf.as_posix(), declared, expected))
                  for target_job, setup_count in scoped_setups.items():
                      if setup_count != 1:
                          mismatches.append((wf.as_posix(), str(setup_count),
                                             f"exactly one setup-python in job {target_job}"))
                  if declared_versions != structured_versions:
                      mismatches.append((wf.as_posix(), str(declared_versions),
                                         "exactly the structured workflow version declarations"))
                  continue
              expected = patch_pins.get(wf.as_posix(), env_version)
              if wf.as_posix() in patch_pins:
                  if expected.rsplit(".", 1)[0] != env_version:
                      mismatches.append((wf.as_posix(), expected,
                                         f"a patch pin on environment.yml line {env_version}"))
                  if len(declared_versions) != 1:
                      mismatches.append((wf.as_posix(), str(declared_versions),
                                         f"exactly one declaration of {expected}"))
              for declared in declared_versions:
                  if declared != expected:
                      mismatches.append((wf.as_posix(), declared, expected))

          if mismatches:
              print(f"::error::Python version drift detected. environment.yml uses {env_version}.")
              for wf, declared, expected in mismatches:
                  print(f"::error file={wf}::python-version={declared} (expected {expected})")
              sys.exit(1)

          print(f"OK: core workflow declarations match environment.yml python={env_version}; exact patch pins verified.")
          PY

      - name: "Repo hygiene: validate workflow YAML files (fail-closed)"
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          import sys
          import pathlib
          import yaml

          root = pathlib.Path(".github/workflows")
          files = sorted(list(root.glob("*.yml")) + list(root.glob("*.yaml")))

          if not files:
              print("::warning::No workflow files found under .github/workflows/")
              sys.exit(0)

          # Guardrail: unquoted ':' + whitespace inside a step name can break YAML parsing in GitHub Actions.
          colon_name_re = re.compile(r'^\s*-\s*name:\s+[^"\'].*:\s+.*$', re.MULTILINE)

          ok = True

          for f in files:
              text = f.read_text(encoding="utf-8", errors="replace")

              m = colon_name_re.search(text)
              if m:
                  line_no = text[:m.start()].count("\n") + 1
                  print(
                      f"::error file={f},line={line_no}::"
                      "Unquoted ':' in step name. Quote the value or use a block scalar (name: >-)."
                  )
                  ok = False

              try:
                  obj = yaml.safe_load(text)
              except yaml.YAMLError as e:
                  # Best-effort line/col extraction
                  line = None
                  col = None
                  mark = getattr(e, "problem_mark", None)
                  if mark is not None:
                      line = mark.line + 1
                      col = mark.column + 1
                  loc = f",line={line},col={col}" if line is not None and col is not None else ""
                  msg = str(e).replace("\n", " | ")
                  print(f"::error file={f}{loc}::YAML parse error: {msg}")
                  ok = False
                  continue

              if obj is None:
                  print(f"::error file={f}::Workflow YAML is empty (safe_load returned None).")
                  ok = False
                  continue

              if not isinstance(obj, dict):
                  print(f"::error file={f}::Workflow YAML must be a mapping at top-level (got {type(obj).__name__}).")
                  ok = False
                  continue

          if not ok:
              sys.exit(1)

          print(f"OK: validated {len(files)} workflow file(s).")
          PY

      - name: "Repo hygiene: forbid case-insensitive path collisions (file/file + file/dir)"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from collections import defaultdict
          import subprocess

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()

          # 1) File-vs-file collisions: two tracked files whose full paths differ only by case.
          files_by_lower = defaultdict(list)

          # 2) File-vs-directory collisions: a tracked file path conflicts with a directory name
          #    implied by other tracked files.
          #
          # Example:
          #   - file "Foo"
          #   - file "foo/bar.txt"  (implies directory "foo/")
          # On case-insensitive filesystems, this fails checkout.
          dir_required_by_lower = defaultdict(set)  # dir_lower -> {example file that requires this directory}

          for f in files:
              fl = f.lower()
              files_by_lower[fl].append(f)

              parts = f.split("/")
              # Collect all directory prefixes for this file path
              for i in range(1, len(parts)):
                  d = "/".join(parts[:i])
                  dir_required_by_lower[d.lower()].add(f)

          file_file = {k: v for k, v in files_by_lower.items() if len(v) > 1}

          file_dir = {}
          for d_lower, examples in dir_required_by_lower.items():
              if d_lower in files_by_lower:
                  file_dir[d_lower] = (files_by_lower[d_lower], sorted(examples))

          if not file_file and not file_dir:
              print("OK: no case-insensitive path collisions.")
              sys.exit(0)

          if file_file:
              print("ERROR: case-insensitive file-vs-file collisions detected:")
              for k in sorted(file_file.keys()):
                  print(" - " + "  |  ".join(sorted(file_file[k])))

          if file_dir:
              print("ERROR: case-insensitive file-vs-directory collisions detected:")
              for d_lower in sorted(file_dir.keys()):
                  file_paths, examples = file_dir[d_lower]
                  print(f" - File path(s) collide with directory '{d_lower}/': " + "  |  ".join(sorted(file_paths)))
                  for ex in examples[:10]:
                      print("     requires directory for: " + ex)
                  if len(examples) > 10:
                      print(f"     ... and {len(examples) - 10} more")

          sys.exit(1)
          PY

      - name: "Repo hygiene: forbid ignored workflows under github/workflows/"
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '^github/workflows/.*\.ya?ml$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Found workflow files under github/workflows/ (ignored by GitHub Actions)."
            echo "Move these files under .github/workflows/:"
            echo "$bad" | sed 's/^/ - /'
            exit 1
          fi
          echo "OK: no ignored workflows under github/workflows/."

      - name: "Repo hygiene: forbid nested fixtures"
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '^tests/fixtures/.*/tests/fixtures/' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Nested fixture path detected (tests/fixtures/**/tests/fixtures/**)."
            echo "$bad" | sed 's/^/ - /'
            exit 1
          fi
          echo "OK: no nested fixtures detected."
