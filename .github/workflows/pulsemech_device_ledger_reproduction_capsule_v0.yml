name: PULSEmech Device Ledger Reproduction Capsule v0

# PR 1 validates the exact contract surface only.
# Deterministic Capsule construction and reproduction execution belong to PR 2.
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pulsemech_device_ledger_reproduction_capsule_v0.yml"
      - "ci/tools-tests.list"
      - "contracts/pulsemech_device_canonical_json_v0.json"
      - "contracts/pulsemech_device_ledger_reproduction_capsule_v0.json"
      - "schemas/pulsemech_device_ledger_reproduction_capsule_manifest_v0.schema.json"
      - "examples/device_transition_ledger/pulsemech_device_ledger_reproduction_capsule_manifest_reference_v0.json"
      - "examples/device_transition_ledger/pulsemech_device_transition_ledger_reference_v0.pulseledger"
      - "examples/device_transition_ledger/pulsemech_device_transition_ledger_reference_verification_v0.json"
      - "tools/verify_pulsemech_device_ledger_v0.py"
      - "tests/test_pulsemech_device_ledger_reproduction_capsule_contract_v0.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pulsemech_device_ledger_reproduction_capsule_v0.yml"
      - "ci/tools-tests.list"
      - "contracts/pulsemech_device_canonical_json_v0.json"
      - "contracts/pulsemech_device_ledger_reproduction_capsule_v0.json"
      - "schemas/pulsemech_device_ledger_reproduction_capsule_manifest_v0.schema.json"
      - "examples/device_transition_ledger/pulsemech_device_ledger_reproduction_capsule_manifest_reference_v0.json"
      - "examples/device_transition_ledger/pulsemech_device_transition_ledger_reference_v0.pulseledger"
      - "examples/device_transition_ledger/pulsemech_device_transition_ledger_reference_verification_v0.json"
      - "tools/verify_pulsemech_device_ledger_v0.py"
      - "tests/test_pulsemech_device_ledger_reproduction_capsule_contract_v0.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulsemech-device-ledger-reproduction-capsule-v0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capsule_contract:
    name: Capsule contract regression
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact contract-test Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pinned
        with:
          python-version: "3.11.9"

      - name: Verify contract-test interpreter
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import platform
          import sys
          import unicodedata

          failures = []

          if platform.python_implementation() != "CPython":
              failures.append(
                  "expected CPython, observed "
                  + platform.python_implementation()
              )

          observed_version = tuple(sys.version_info[:3])
          if observed_version != (3, 11, 9):
              failures.append(
                  "expected Python 3.11.9, observed "
                  + ".".join(str(part) for part in observed_version)
              )

          if unicodedata.unidata_version != "14.0.0":
              failures.append(
                  "expected Unicode data 14.0.0, observed "
                  + unicodedata.unidata_version
              )

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)

          print("OK: exact contract-test interpreter verified")
          PY

      - name: Install CI-only contract-test dependencies
        shell: bash
        run: |
          set -euo pipefail

          # These packages execute the PR 1 regression only.
          # This step is not the PR 2 no-network reproduction execution.
          python -m pip install --no-cache-dir \
            "pytest==9.0.2" \
            "jsonschema==4.26.0"

      - name: Verify exact tools-test registration
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          manifest_path = Path("ci/tools-tests.list")
          target = (
              "tests/"
              "test_pulsemech_device_ledger_"
              "reproduction_capsule_contract_v0.py"
          )

          entries = [
              line.strip()
              for line in manifest_path.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]

          observed = entries.count(target)
          if observed != 1:
              print(
                  "::error::Capsule contract regression registration count "
                  f"is {observed}; expected exactly 1"
              )
              raise SystemExit(1)

          print("OK: Capsule contract regression is registered exactly once")
          PY

      - name: Run exact Capsule contract regression
        shell: bash
        run: |
          set -euo pipefail

          python -m pytest -q \
            tests/test_pulsemech_device_ledger_reproduction_capsule_contract_v0.py

      - name: Verify regression did not modify tracked files
        shell: bash
        run: |
          set -euo pipefail

          tracked_changes="$(git status --porcelain --untracked-files=no)"

          if [ -n "$tracked_changes" ]; then
            printf '%s\n' "$tracked_changes"
            echo "::error::Capsule contract regression modified tracked files"
            exit 1
          fi

          echo "OK: tracked repository files remain unchanged"
