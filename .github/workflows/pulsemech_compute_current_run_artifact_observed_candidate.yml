name: PULSEmech compute current-run artifact-observed candidate

on:
  workflow_dispatch:
    inputs:
      provider_run_id:
        description: >-
          Completed same-repository Step 3F current-run export candidate
          workflow run ID whose exact candidate artifact will be consumed.
        required: true
        type: string

concurrency:
  group: >-
    pulsemech-compute-current-run-artifact-observed-${{ inputs.provider_run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build-current-run-artifact-observed-candidate:
    name: Build non-active current-run artifact-observed candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      PROVIDER_RUN_ID_INPUT: ${{ inputs.provider_run_id }}
      CONTROL_PLANE_REPOSITORY: ${{ github.repository }}
      CONTROL_PLANE_REVISION: ${{ github.workflow_sha }}
      TRIGGER_REVISION: ${{ github.sha }}
      TRIGGER_REF: ${{ github.ref }}
      TRIGGER_EVENT: ${{ github.event_name }}
      CONTROL_PLANE_WORKFLOW_REF: ${{ github.workflow_ref }}
      STEP3G_WORKFLOW_NAME: >-
        PULSEmech compute current-run artifact-observed candidate
      STEP3G_WORKFLOW_PATH: >-
        .github/workflows/pulsemech_compute_current_run_artifact_observed_candidate.yml
      PROVIDER_WORKFLOW_NAME: PULSEmech compute current-run export candidate
      PROVIDER_WORKFLOW_PATH: >-
        .github/workflows/pulsemech_compute_current_run_export_candidate.yml
      SOURCE_WORKFLOW_NAME: PULSE CI
      SOURCE_WORKFLOW_PATH: .github/workflows/pulse_ci.yml
      SOURCE_REF: refs/heads/main
      PROVIDER_ARTIFACT_PREFIX: >-
        pulsemech-compute-current-run-export-candidate-
      MAX_GITHUB_JSON_BYTES: "8388608"
      MAX_PROVIDER_ENVELOPE_BYTES: "805306368"

    steps:
      - name: Resolve exact Step 3F provider run and protected control plane
        id: provider
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from typing import Any


          MAX_RESPONSE = int(os.environ["MAX_GITHUB_JSON_BYTES"])


          def fail(message: str) -> None:
              raise SystemExit(f"provider_run_resolution_failed: {message}")


          def reject_duplicate_keys(
              pairs: list[tuple[str, Any]],
          ) -> dict[str, Any]:
              result: dict[str, Any] = {}
              for key, value in pairs:
                  if key in result:
                      fail(f"duplicate_json_key: {key!r}")
                  result[key] = value
              return result


          def gh_json(endpoint: str) -> dict[str, Any]:
              try:
                  result = subprocess.run(
                      [
                          "gh",
                          "api",
                          "-H",
                          "Accept: application/vnd.github+json",
                          "-H",
                          "X-GitHub-Api-Version: 2022-11-28",
                          endpoint,
                      ],
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=False,
                      timeout=60,
                      env={
                          "GH_TOKEN": os.environ["GH_TOKEN"],
                          "LANG": "C",
                          "LC_ALL": "C",
                          "PATH": os.environ.get("PATH", ""),
                      },
                  )
              except (OSError, subprocess.TimeoutExpired) as exc:
                  fail(f"gh_api_execution_failed endpoint={endpoint!r}: {exc}")
              if len(result.stdout) > MAX_RESPONSE:
                  fail(
                      f"gh_api_stdout_too_large endpoint={endpoint!r} "
                      f"size={len(result.stdout)} maximum={MAX_RESPONSE}"
                  )
              if len(result.stderr) > MAX_RESPONSE:
                  fail(
                      f"gh_api_stderr_too_large endpoint={endpoint!r} "
                      f"size={len(result.stderr)} maximum={MAX_RESPONSE}"
                  )
              if result.returncode != 0:
                  detail = result.stderr.decode("utf-8", errors="replace")
                  fail(
                      f"gh_api_failed endpoint={endpoint!r} "
                      f"returncode={result.returncode} detail={detail!r}"
                  )
              try:
                  value = json.loads(
                      result.stdout.decode("utf-8", errors="strict"),
                      object_pairs_hook=reject_duplicate_keys,
                  )
              except Exception as exc:
                  fail(f"gh_api_invalid_json endpoint={endpoint!r}: {exc}")
              if not isinstance(value, dict):
                  fail(f"gh_api_not_object endpoint={endpoint!r}")
              return value


          def canonical_positive_decimal(value: str, *, label: str) -> int:
              normalized = value.strip()
              if re.fullmatch(r"[1-9][0-9]*", normalized) is None:
                  fail(f"{label}_not_positive_canonical_decimal: {normalized!r}")
              return int(normalized, 10)


          def canonical_sha40(value: Any, *, label: str) -> str:
              normalized = str(value or "").strip().lower()
              if re.fullmatch(r"[0-9a-f]{40}", normalized) is None:
                  fail(f"{label}_not_sha40: {normalized!r}")
              return normalized


          def positive_int(value: Any, *, label: str) -> int:
              if (
                  not isinstance(value, int)
                  or isinstance(value, bool)
                  or value <= 0
              ):
                  fail(f"{label}_not_positive_integer: {value!r}")
              return value


          def canonical_utc(value: Any, *, label: str) -> str:
              if not isinstance(value, str) or re.fullmatch(
                  r"[0-9]{4}-[0-9]{2}-[0-9]{2}"
                  r"T[0-9]{2}:[0-9]{2}:[0-9]{2}Z",
                  value,
              ) is None:
                  fail(f"{label}_not_canonical_utc: {value!r}")
              return value


          repository = os.environ["GITHUB_REPOSITORY"]
          if os.environ.get("GITHUB_WORKFLOW") != os.environ[
              "STEP3G_WORKFLOW_NAME"
          ]:
              fail(
                  "control_plane_workflow_name_mismatch: "
                  f"expected={os.environ['STEP3G_WORKFLOW_NAME']!r} "
                  f"actual={os.environ.get('GITHUB_WORKFLOW')!r}"
              )
          if os.environ["TRIGGER_EVENT"] != "workflow_dispatch":
              fail(
                  "unexpected_trigger_event: "
                  f"{os.environ['TRIGGER_EVENT']!r}"
              )
          if os.environ["TRIGGER_REF"] != "refs/heads/main":
              fail(
                  "control_plane_ref_not_main: "
                  f"{os.environ['TRIGGER_REF']!r}"
              )

          control_revision = canonical_sha40(
              os.environ["CONTROL_PLANE_REVISION"],
              label="control_plane_revision",
          )
          trigger_revision = canonical_sha40(
              os.environ["TRIGGER_REVISION"],
              label="trigger_revision",
          )
          if trigger_revision != control_revision:
              fail(
                  "workflow_sha_and_trigger_sha_mismatch: "
                  f"workflow_sha={control_revision} "
                  f"trigger_sha={trigger_revision}"
              )

          expected_workflow_ref = (
              f"{repository}/{os.environ['STEP3G_WORKFLOW_PATH']}"
              "@refs/heads/main"
          )
          if os.environ["CONTROL_PLANE_WORKFLOW_REF"] != expected_workflow_ref:
              fail(
                  "control_plane_workflow_ref_mismatch: "
                  f"expected={expected_workflow_ref!r} "
                  f"actual={os.environ['CONTROL_PLANE_WORKFLOW_REF']!r}"
              )

          provider_run_id = canonical_positive_decimal(
              os.environ["PROVIDER_RUN_ID_INPUT"],
              label="provider_run_id",
          )
          run = gh_json(
              f"/repos/{repository}/actions/runs/{provider_run_id}"
          )
          if run.get("id") != provider_run_id:
              fail(f"provider_run_id_mismatch: {run.get('id')!r}")
          if run.get("name") != os.environ["PROVIDER_WORKFLOW_NAME"]:
              fail(f"provider_workflow_name_mismatch: {run.get('name')!r}")
          if run.get("path") != os.environ["PROVIDER_WORKFLOW_PATH"]:
              fail(f"provider_workflow_path_mismatch: {run.get('path')!r}")
          if run.get("event") != "workflow_dispatch":
              fail(f"provider_event_not_workflow_dispatch: {run.get('event')!r}")
          if (
              run.get("status") != "completed"
              or run.get("conclusion") != "success"
          ):
              fail(
                  "provider_run_not_completed_success: "
                  f"status={run.get('status')!r} "
                  f"conclusion={run.get('conclusion')!r}"
              )
          if run.get("head_branch") != "main":
              fail(
                  f"provider_head_branch_not_main: "
                  f"{run.get('head_branch')!r}"
              )

          repository_record = run.get("repository")
          head_repository = run.get("head_repository")
          if (
              not isinstance(repository_record, dict)
              or repository_record.get("full_name") != repository
          ):
              fail("provider_repository_mismatch")
          if (
              not isinstance(head_repository, dict)
              or head_repository.get("full_name") != repository
          ):
              fail("provider_head_repository_mismatch_or_fork")

          provider_revision = canonical_sha40(
              run.get("head_sha"),
              label="provider_revision",
          )
          provider_run_number = positive_int(
              run.get("run_number"),
              label="provider_run_number",
          )
          provider_run_attempt = positive_int(
              run.get("run_attempt"),
              label="provider_run_attempt",
          )
          provider_updated_utc = canonical_utc(
              run.get("updated_at"),
              label="provider_updated_utc",
          )
          workflow_id = positive_int(
              run.get("workflow_id"),
              label="provider_workflow_id",
          )

          workflow = gh_json(
              f"/repos/{repository}/actions/workflows/{workflow_id}"
          )
          if workflow.get("name") != os.environ["PROVIDER_WORKFLOW_NAME"]:
              fail(
                  "resolved_provider_workflow_name_mismatch: "
                  f"{workflow.get('name')!r}"
              )
          if workflow.get("path") != os.environ["PROVIDER_WORKFLOW_PATH"]:
              fail(
                  "resolved_provider_workflow_path_mismatch: "
                  f"{workflow.get('path')!r}"
              )
          if workflow.get("state") != "active":
              fail(
                  "resolved_provider_workflow_not_active: "
                  f"{workflow.get('state')!r}"
              )

          provider_run_key = (
              f"GITHUB_RUN_ID={provider_run_id}"
              f"|GITHUB_RUN_ATTEMPT={provider_run_attempt}"
              f"|GITHUB_WORKFLOW={os.environ['PROVIDER_WORKFLOW_NAME']}"
          )
          outputs = {
              "control_plane_revision": control_revision,
              "provider_revision": provider_revision,
              "provider_run_attempt": str(provider_run_attempt),
              "provider_run_id": str(provider_run_id),
              "provider_run_key": provider_run_key,
              "provider_run_number": str(provider_run_number),
              "provider_updated_utc": provider_updated_utc,
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
              newline="\n",
          ) as stream:
              for key, value in outputs.items():
                  if "\n" in value or "\r" in value:
                      fail(f"multiline_output_rejected: {key}")
                  stream.write(f"{key}={value}\n")
          PY

      - name: Resolve exact Step 3F candidate artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_RUN_ID: ${{ steps.provider.outputs.provider_run_id }}
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from typing import Any


          MAX_RESPONSE = int(os.environ["MAX_GITHUB_JSON_BYTES"])
          MAX_ENVELOPE = int(os.environ["MAX_PROVIDER_ENVELOPE_BYTES"])


          def fail(message: str) -> None:
              raise SystemExit(f"provider_artifact_resolution_failed: {message}")


          def reject_duplicate_keys(
              pairs: list[tuple[str, Any]],
          ) -> dict[str, Any]:
              result: dict[str, Any] = {}
              for key, value in pairs:
                  if key in result:
                      fail(f"duplicate_json_key: {key!r}")
                  result[key] = value
              return result


          def gh_json(endpoint: str) -> dict[str, Any]:
              try:
                  result = subprocess.run(
                      [
                          "gh",
                          "api",
                          "-H",
                          "Accept: application/vnd.github+json",
                          "-H",
                          "X-GitHub-Api-Version: 2022-11-28",
                          endpoint,
                      ],
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=False,
                      timeout=60,
                      env={
                          "GH_TOKEN": os.environ["GH_TOKEN"],
                          "LANG": "C",
                          "LC_ALL": "C",
                          "PATH": os.environ.get("PATH", ""),
                      },
                  )
              except (OSError, subprocess.TimeoutExpired) as exc:
                  fail(f"gh_api_execution_failed endpoint={endpoint!r}: {exc}")
              if len(result.stdout) > MAX_RESPONSE:
                  fail(
                      f"gh_api_stdout_too_large endpoint={endpoint!r} "
                      f"size={len(result.stdout)} maximum={MAX_RESPONSE}"
                  )
              if len(result.stderr) > MAX_RESPONSE:
                  fail(
                      f"gh_api_stderr_too_large endpoint={endpoint!r} "
                      f"size={len(result.stderr)} maximum={MAX_RESPONSE}"
                  )
              if result.returncode != 0:
                  detail = result.stderr.decode("utf-8", errors="replace")
                  fail(
                      f"gh_api_failed endpoint={endpoint!r} "
                      f"returncode={result.returncode} detail={detail!r}"
                  )
              try:
                  value = json.loads(
                      result.stdout.decode("utf-8", errors="strict"),
                      object_pairs_hook=reject_duplicate_keys,
                  )
              except Exception as exc:
                  fail(f"gh_api_invalid_json endpoint={endpoint!r}: {exc}")
              if not isinstance(value, dict):
                  fail(f"gh_api_not_object endpoint={endpoint!r}")
              return value


          def positive_int(value: Any, *, label: str) -> int:
              if (
                  not isinstance(value, int)
                  or isinstance(value, bool)
                  or value <= 0
              ):
                  fail(f"{label}_not_positive_integer: {value!r}")
              return value


          def canonical_utc(value: Any, *, label: str) -> str:
              if not isinstance(value, str) or re.fullmatch(
                  r"[0-9]{4}-[0-9]{2}-[0-9]{2}"
                  r"T[0-9]{2}:[0-9]{2}:[0-9]{2}Z",
                  value,
              ) is None:
                  fail(f"{label}_not_canonical_utc: {value!r}")
              return value


          def parse_utc(value: str) -> datetime:
              return datetime.strptime(value, "%Y-%m-%dT%H:%M:%SZ")


          repository = os.environ["GITHUB_REPOSITORY"]
          provider_run_id = int(os.environ["PROVIDER_RUN_ID"], 10)
          listing = gh_json(
              f"/repos/{repository}/actions/runs/{provider_run_id}"
              "/artifacts?per_page=100"
          )
          rows = listing.get("artifacts")
          total_count = listing.get("total_count")
          if not isinstance(rows, list):
              fail("artifact_listing_rows_not_array")
          if (
              not isinstance(total_count, int)
              or isinstance(total_count, bool)
              or total_count < 0
          ):
              fail(f"artifact_total_count_invalid: {total_count!r}")
          if total_count != len(rows):
              fail(
                  "artifact_listing_pagination_not_closed: "
                  f"total_count={total_count} returned={len(rows)}"
              )

          pattern = re.compile(
              r"^pulsemech-compute-current-run-export-candidate-"
              r"([1-9][0-9]*)-([1-9][0-9]*)$"
          )
          matches: list[tuple[dict[str, Any], re.Match[str]]] = []
          for row in rows:
              if not isinstance(row, dict):
                  fail("artifact_listing_row_not_object")
              name = row.get("name")
              match = pattern.fullmatch(name) if isinstance(name, str) else None
              if match is not None:
                  matches.append((row, match))
          if len(matches) != 1:
              fail(
                  "candidate_artifact_match_count_invalid: "
                  f"expected=1 actual={len(matches)}"
              )

          artifact, name_match = matches[0]
          artifact_id = positive_int(
              artifact.get("id"),
              label="provider_artifact_id",
          )
          artifact_size = positive_int(
              artifact.get("size_in_bytes"),
              label="provider_artifact_size",
          )
          if artifact_size > MAX_ENVELOPE:
              fail(
                  "provider_artifact_too_large: "
                  f"size={artifact_size} maximum={MAX_ENVELOPE}"
              )
          digest = artifact.get("digest")
          if not isinstance(digest, str) or re.fullmatch(
              r"sha256:[0-9a-f]{64}",
              digest,
          ) is None:
              fail(f"provider_artifact_digest_invalid: {digest!r}")
          if artifact.get("expired") is not False:
              fail(
                  f"provider_artifact_expired_or_unknown: "
                  f"{artifact.get('expired')!r}"
              )
          created_utc = canonical_utc(
              artifact.get("created_at"),
              label="provider_artifact_created_utc",
          )
          expires_utc = canonical_utc(
              artifact.get("expires_at"),
              label="provider_artifact_expires_utc",
          )
          if parse_utc(created_utc) >= parse_utc(expires_utc):
              fail("provider_artifact_retention_window_invalid")

          artifact_name = str(artifact["name"])
          source_run_id = int(name_match.group(1), 10)
          source_run_attempt = int(name_match.group(2), 10)
          outputs = {
              "artifact_created_utc": created_utc,
              "artifact_expires_utc": expires_utc,
              "artifact_id": str(artifact_id),
              "artifact_name": artifact_name,
              "artifact_sha256": digest.removeprefix("sha256:"),
              "artifact_size_bytes": str(artifact_size),
              "source_run_attempt_from_name": str(source_run_attempt),
              "source_run_id_from_name": str(source_run_id),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
              newline="\n",
          ) as stream:
              for key, value in outputs.items():
                  if "\n" in value or "\r" in value:
                      fail(f"multiline_output_rejected: {key}")
                  stream.write(f"{key}={value}\n")
          PY

      - name: Checkout exact protected Step 3G control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.provider.outputs.control_plane_revision }}
          path: control-plane-checkout
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          set-safe-directory: false

      - name: Verify protected Step 3G control-plane surface
        shell: bash
        env:
          CONTROL_REVISION: ${{ steps.provider.outputs.control_plane_revision }}
        run: |
          set -euo pipefail

          CONTROL_ROOT="${GITHUB_WORKSPACE}/control-plane-checkout"
          test "$(git -C "${CONTROL_ROOT}" rev-parse HEAD)" = "${CONTROL_REVISION}"

          REQUIRED_CONTROL_PATHS=(
            ".github/workflows/pulsemech_compute_current_run_artifact_observed_candidate.yml"
            ".github/workflows/pulsemech_compute_current_run_export_candidate.yml"
            ".github/workflows/pulse_ci.yml"
            "requirements.txt"
            "pulse_gate_policy_v0.yml"
            "pulse_gate_registry_v0.yml"
            "tools/load_pulsemech_compute_current_run_export_candidate_bundle_v0.py"
            "tools/build_pulsemech_compute_current_run_artifact_observed_proof_v0.py"
            "tools/build_pulsemech_compute_binding_report_from_subject_input_v0.py"
            "schemas/pulsemech_compute_subject_input_packet_v0.schema.json"
            "tools/check_pulsemech_compute_subject_input_packet_v0.py"
            "tools/build_pulsemech_compute_binding_report_v0.py"
            "tools/pulsemech_compute_binding_analyzer_core_v0.py"
            "schemas/pulsemech_compute_binding_report_v0.schema.json"
            "tools/check_pulsemech_compute_binding_report_v0.py"
            "tools/plan_pulsemech_integration_v0.py"
            "schemas/pulsemech_integration_request_v0.schema.json"
            "schemas/pulsemech_integration_component_manifest_v0.schema.json"
            "schemas/pulsemech_integration_plan_v0.schema.json"
            "tools/build_pulsemech_compute_planned_observed_relation_v0.py"
            "schemas/pulsemech_compute_planned_observed_relation_v0.schema.json"
            "tools/check_pulsemech_compute_planned_observed_relation_v0.py"
            "schemas/pulsemech_compute_runtime_observation_packet_v0.schema.json"
            "tools/check_pulsemech_compute_runtime_observation_packet_v0.py"
            "tools/fold_pulsemech_compute_planned_observed_relation_into_status_v0.py"
          )
          for relative in "${REQUIRED_CONTROL_PATHS[@]}"; do
            candidate="${CONTROL_ROOT}/${relative}"
            if [[ ! -f "${candidate}" || -L "${candidate}" ]]; then
              echo "::error::protected control-plane component missing or symlinked: ${relative}"
              exit 1
            fi
          done

      - name: Set up protected Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install protected control-plane dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            -r "${GITHUB_WORKSPACE}/control-plane-checkout/requirements.txt"
          python -m pip install --disable-pip-version-check jsonschema

      - name: Download and bind exact Step 3F candidate envelope
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          PROVIDER_ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
          PROVIDER_ARTIFACT_SIZE: ${{ steps.artifact.outputs.artifact_size_bytes }}
        run: |
          set -euo pipefail
          umask 077

          DOWNLOAD_ROOT="${RUNNER_TEMP}/pulsemech-step3g-provider-download"
          if [[ -e "${DOWNLOAD_ROOT}" ]]; then
            echo "::error::provider download root already exists: ${DOWNLOAD_ROOT}"
            exit 1
          fi
          mkdir -m 700 "${DOWNLOAD_ROOT}"
          TEMP_PATH="${DOWNLOAD_ROOT}/.provider-artifact.$RANDOM.$RANDOM.tmp"
          FINAL_PATH="${DOWNLOAD_ROOT}/provider-candidate-envelope.zip"

          cleanup() {
            rm -f -- "${TEMP_PATH}"
          }
          trap cleanup EXIT

          timeout 180 gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROVIDER_ARTIFACT_ID}/zip" \
            > "${TEMP_PATH}"

          if [[ ! -f "${TEMP_PATH}" || -L "${TEMP_PATH}" ]]; then
            echo "::error::downloaded provider envelope is not a regular non-symlink file"
            exit 1
          fi
          if [[ "$(stat -c '%h' "${TEMP_PATH}")" != "1" ]]; then
            echo "::error::downloaded provider envelope link count is not one"
            exit 1
          fi

          OBSERVED_SIZE="$(stat -c '%s' "${TEMP_PATH}")"
          OBSERVED_SHA256="$(sha256sum "${TEMP_PATH}" | awk '{print $1}')"
          if [[ "${OBSERVED_SIZE}" != "${PROVIDER_ARTIFACT_SIZE}" ]]; then
            echo "::error::provider envelope size mismatch"
            exit 1
          fi
          if [[ "${OBSERVED_SHA256}" != "${PROVIDER_ARTIFACT_SHA256}" ]]; then
            echo "::error::provider envelope SHA-256 mismatch"
            exit 1
          fi

          chmod 0444 "${TEMP_PATH}"
          mv -- "${TEMP_PATH}" "${FINAL_PATH}"
          trap - EXIT

          test -f "${FINAL_PATH}"
          test ! -L "${FINAL_PATH}"
          test "$(stat -c '%h' "${FINAL_PATH}")" = "1"
          test "$(stat -c '%s' "${FINAL_PATH}")" = "${PROVIDER_ARTIFACT_SIZE}"
          test "$(sha256sum "${FINAL_PATH}" | awk '{print $1}')" = \
            "${PROVIDER_ARTIFACT_SHA256}"

          printf 'envelope_path=%s\n' "${FINAL_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Verify and materialize exact candidate-bundle intake
        id: intake
        shell: bash
        env:
          ENVELOPE_PATH: ${{ steps.download.outputs.envelope_path }}
          CONTROL_REVISION: ${{ steps.provider.outputs.control_plane_revision }}
          PROVIDER_REVISION: ${{ steps.provider.outputs.provider_revision }}
          PROVIDER_RUN_ID: ${{ steps.provider.outputs.provider_run_id }}
          PROVIDER_RUN_NUMBER: ${{ steps.provider.outputs.provider_run_number }}
          PROVIDER_RUN_ATTEMPT: ${{ steps.provider.outputs.provider_run_attempt }}
          PROVIDER_UPDATED_UTC: ${{ steps.provider.outputs.provider_updated_utc }}
          PROVIDER_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          PROVIDER_ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
          PROVIDER_ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
          PROVIDER_ARTIFACT_SIZE: ${{ steps.artifact.outputs.artifact_size_bytes }}
          PROVIDER_ARTIFACT_CREATED_UTC: ${{ steps.artifact.outputs.artifact_created_utc }}
          PROVIDER_ARTIFACT_EXPIRES_UTC: ${{ steps.artifact.outputs.artifact_expires_utc }}
          SOURCE_RUN_ID_FROM_NAME: ${{ steps.artifact.outputs.source_run_id_from_name }}
          SOURCE_RUN_ATTEMPT_FROM_NAME: ${{ steps.artifact.outputs.source_run_attempt_from_name }}
        run: |
          set -euo pipefail
          umask 077

          CONTROL_ROOT="${GITHUB_WORKSPACE}/control-plane-checkout"
          INTAKE_PARENT="${RUNNER_TEMP}/pulsemech-step3g-candidate-intake"
          INTAKE_DIRECTORY="${INTAKE_PARENT}/verified-candidate-bundle"
          STDOUT_PATH="${INTAKE_PARENT}/candidate-bundle-intake-report.stdout.json"

          if [[ -e "${INTAKE_PARENT}" ]]; then
            echo "::error::candidate intake parent already exists: ${INTAKE_PARENT}"
            exit 1
          fi
          mkdir -m 700 "${INTAKE_PARENT}"

          PRODUCER_RUN_KEY="GITHUB_RUN_ID=${GITHUB_RUN_ID}|GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}|GITHUB_WORKFLOW=${GITHUB_WORKFLOW}|JOB=candidate-bundle-intake"
          CI_IDENTITY="${GITHUB_WORKFLOW}/${GITHUB_JOB}/candidate-bundle-intake"

          python -I \
            "${CONTROL_ROOT}/tools/load_pulsemech_compute_current_run_export_candidate_bundle_v0.py" \
            --artifact-envelope "${ENVELOPE_PATH}" \
            --repository "${GITHUB_REPOSITORY}" \
            --provider-workflow-name "${PROVIDER_WORKFLOW_NAME}" \
            --provider-workflow-path "${PROVIDER_WORKFLOW_PATH}" \
            --provider-workflow-run-id "${PROVIDER_RUN_ID}" \
            --provider-workflow-run-number "${PROVIDER_RUN_NUMBER}" \
            --provider-workflow-run-attempt "${PROVIDER_RUN_ATTEMPT}" \
            --provider-workflow-event workflow_dispatch \
            --provider-workflow-head-branch main \
            --provider-workflow-revision "${PROVIDER_REVISION}" \
            --provider-workflow-status completed \
            --provider-workflow-conclusion success \
            --provider-workflow-updated-utc "${PROVIDER_UPDATED_UTC}" \
            --provider-artifact-id "${PROVIDER_ARTIFACT_ID}" \
            --provider-artifact-name "${PROVIDER_ARTIFACT_NAME}" \
            --provider-artifact-created-utc "${PROVIDER_ARTIFACT_CREATED_UTC}" \
            --provider-artifact-expires-utc "${PROVIDER_ARTIFACT_EXPIRES_UTC}" \
            --provider-artifact-expired false \
            --provider-artifact-sha256 "${PROVIDER_ARTIFACT_SHA256}" \
            --provider-artifact-size-bytes "${PROVIDER_ARTIFACT_SIZE}" \
            --producer-run-key "${PRODUCER_RUN_KEY}" \
            --ci-workflow-or-job-identity "${CI_IDENTITY}" \
            --control-plane-root "${CONTROL_ROOT}" \
            --control-plane-revision "${CONTROL_REVISION}" \
            --output-directory "${INTAKE_DIRECTORY}" \
            > "${STDOUT_PATH}"

          cmp --silent \
            "${STDOUT_PATH}" \
            "${INTAKE_DIRECTORY}/candidate-bundle-intake-report.json"

          INTAKE_DIRECTORY="${INTAKE_DIRECTORY}" \
          CONTROL_REVISION="${CONTROL_REVISION}" \
          PROVIDER_REVISION="${PROVIDER_REVISION}" \
          PROVIDER_RUN_ID="${PROVIDER_RUN_ID}" \
          PROVIDER_RUN_NUMBER="${PROVIDER_RUN_NUMBER}" \
          PROVIDER_RUN_ATTEMPT="${PROVIDER_RUN_ATTEMPT}" \
          PROVIDER_UPDATED_UTC="${PROVIDER_UPDATED_UTC}" \
          PROVIDER_ARTIFACT_ID="${PROVIDER_ARTIFACT_ID}" \
          PROVIDER_ARTIFACT_NAME="${PROVIDER_ARTIFACT_NAME}" \
          PROVIDER_ARTIFACT_SHA256="${PROVIDER_ARTIFACT_SHA256}" \
          PROVIDER_ARTIFACT_SIZE="${PROVIDER_ARTIFACT_SIZE}" \
          PROVIDER_ARTIFACT_CREATED_UTC="${PROVIDER_ARTIFACT_CREATED_UTC}" \
          PROVIDER_ARTIFACT_EXPIRES_UTC="${PROVIDER_ARTIFACT_EXPIRES_UTC}" \
          SOURCE_RUN_ID_FROM_NAME="${SOURCE_RUN_ID_FROM_NAME}" \
          SOURCE_RUN_ATTEMPT_FROM_NAME="${SOURCE_RUN_ATTEMPT_FROM_NAME}" \
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import stat
          from pathlib import Path
          from typing import Any


          def fail(message: str) -> None:
              raise SystemExit(f"candidate_intake_output_invalid: {message}")


          def reject_duplicate_keys(
              pairs: list[tuple[str, Any]],
          ) -> dict[str, Any]:
              result: dict[str, Any] = {}
              for key, value in pairs:
                  if key in result:
                      fail(f"duplicate_json_key: {key!r}")
                  result[key] = value
              return result


          def render(value: Any) -> bytes:
              return (
                  json.dumps(
                      value,
                      indent=2,
                      ensure_ascii=False,
                      sort_keys=True,
                      allow_nan=False,
                  )
                  + "\n"
              ).encode("utf-8")


          def parse(path: Path, *, label: str) -> tuple[dict[str, Any], bytes]:
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode):
                  fail(f"{label}_not_regular_non_symlink")
              raw = path.read_bytes()
              try:
                  value = json.loads(
                      raw.decode("utf-8", errors="strict"),
                      object_pairs_hook=reject_duplicate_keys,
                  )
              except Exception as exc:
                  fail(f"{label}_invalid_json: {exc}")
              if not isinstance(value, dict):
                  fail(f"{label}_not_object")
              if raw != render(value):
                  fail(f"{label}_not_canonical_json")
              return value, raw


          def positive_int(value: Any, *, label: str) -> int:
              if (
                  not isinstance(value, int)
                  or isinstance(value, bool)
                  or value <= 0
              ):
                  fail(f"{label}_not_positive_integer: {value!r}")
              return value


          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          intake = Path(os.environ["INTAKE_DIRECTORY"])
          report_path = intake / "candidate-bundle-intake-report.json"
          report, report_bytes = parse(report_path, label="intake_report")

          expected_top = {
              "authority_boundary",
              "bundle_identity",
              "content_boundary",
              "document_type",
              "errors",
              "files",
              "inner_carrier_verification",
              "ok",
              "output_layout",
              "producer",
              "provider_binding",
              "record_status",
              "schema_version",
              "source_subject",
          }
          if set(report) != expected_top:
              fail("intake_report_top_level_keys_mismatch")
          if report.get("schema_version") != (
              "pulsemech_compute_current_run_export_candidate_bundle_intake_v0"
          ):
              fail("intake_report_schema_version_mismatch")
          if report.get("document_type") != (
              "pulsemech_compute_current_run_export_candidate_bundle_intake"
          ):
              fail("intake_report_document_type_mismatch")
          if (
              report.get("record_status") != "observed"
              or report.get("ok") is not True
              or report.get("errors") != []
          ):
              fail("intake_report_not_successful_observed")

          expected_authority = {
              "activates_compute_gate": False,
              "candidate_only": True,
              "changes_gate_policy": False,
              "changes_gate_semantics": False,
              "changes_release_authority": False,
              "creates_compute_budget": False,
              "creates_gate_result": False,
              "creates_release_decision": False,
              "intake_is_release_authority": False,
              "materializes_candidate_gate_state": False,
              "mutates_subject_run": False,
              "non_active": True,
              "provider_binding_only": True,
              "produces_runtime_observation": False,
              "produces_transition_relation": False,
              "write_mode": "verified_bundle_copy_only",
              "writes_target_repository": False,
          }
          if report.get("authority_boundary") != expected_authority:
              fail("intake_authority_boundary_mismatch")

          provider = report.get("provider_binding")
          if not isinstance(provider, dict):
              fail("provider_binding_not_object")
          workflow_run = provider.get("workflow_run")
          artifact = provider.get("artifact")
          if not isinstance(workflow_run, dict) or not isinstance(artifact, dict):
              fail("provider_binding_records_missing")
          expected_workflow = {
              "attempt": int(os.environ["PROVIDER_RUN_ATTEMPT"]),
              "conclusion": "success",
              "event": "workflow_dispatch",
              "head_branch": "main",
              "id": int(os.environ["PROVIDER_RUN_ID"]),
              "number": int(os.environ["PROVIDER_RUN_NUMBER"]),
              "revision": os.environ["PROVIDER_REVISION"],
              "run_key": (
                  f"GITHUB_RUN_ID={os.environ['PROVIDER_RUN_ID']}"
                  f"|GITHUB_RUN_ATTEMPT={os.environ['PROVIDER_RUN_ATTEMPT']}"
                  f"|GITHUB_WORKFLOW="
                  "PULSEmech compute current-run export candidate"
              ),
              "status": "completed",
              "updated_utc": os.environ["PROVIDER_UPDATED_UTC"],
              "workflow_name": (
                  "PULSEmech compute current-run export candidate"
              ),
              "workflow_path": (
                  ".github/workflows/"
                  "pulsemech_compute_current_run_export_candidate.yml"
              ),
          }
          if workflow_run != expected_workflow:
              fail("provider_workflow_binding_mismatch")
          expected_artifact = {
              "created_utc": os.environ["PROVIDER_ARTIFACT_CREATED_UTC"],
              "expired": False,
              "expires_utc": os.environ["PROVIDER_ARTIFACT_EXPIRES_UTC"],
              "id": int(os.environ["PROVIDER_ARTIFACT_ID"]),
              "name": os.environ["PROVIDER_ARTIFACT_NAME"],
              "sha256": os.environ["PROVIDER_ARTIFACT_SHA256"],
              "size_bytes": int(os.environ["PROVIDER_ARTIFACT_SIZE"]),
          }
          if artifact != expected_artifact:
              fail("provider_artifact_binding_mismatch")
          if provider.get("provider") != "github_actions":
              fail("provider_identity_mismatch")
          if provider.get("repository") != os.environ["GITHUB_REPOSITORY"]:
              fail("provider_repository_mismatch")

          producer = report.get("producer")
          if not isinstance(producer, dict):
              fail("intake_producer_not_object")
          if (
              producer.get("producer_source_revision")
              != os.environ["CONTROL_REVISION"]
          ):
              fail("intake_producer_revision_mismatch")
          if producer.get("producer_source") != (
              "tools/"
              "load_pulsemech_compute_current_run_export_candidate_bundle_v0.py"
          ):
              fail("intake_producer_source_mismatch")

          subject = report.get("source_subject")
          if not isinstance(subject, dict):
              fail("source_subject_not_object")
          source_run_id = positive_int(
              subject.get("source_run_id"),
              label="source_run_id",
          )
          source_run_number = positive_int(
              subject.get("source_run_number"),
              label="source_run_number",
          )
          source_run_attempt = positive_int(
              subject.get("source_run_attempt"),
              label="source_run_attempt",
          )
          if source_run_id != int(os.environ["SOURCE_RUN_ID_FROM_NAME"]):
              fail("source_run_id_artifact_name_mismatch")
          if source_run_attempt != int(
              os.environ["SOURCE_RUN_ATTEMPT_FROM_NAME"]
          ):
              fail("source_run_attempt_artifact_name_mismatch")
          if subject.get("repository") != os.environ["GITHUB_REPOSITORY"]:
              fail("source_subject_repository_mismatch")
          if subject.get("workflow_name") != "PULSE CI":
              fail("source_subject_workflow_name_mismatch")
          if subject.get("workflow_path") != ".github/workflows/pulse_ci.yml":
              fail("source_subject_workflow_path_mismatch")
          subject_revision = str(subject.get("subject_revision", "")).lower()
          if re.fullmatch(r"[0-9a-f]{40}", subject_revision) is None:
              fail("source_subject_revision_not_sha40")

          rows = report.get("files")
          if not isinstance(rows, list) or not rows:
              fail("intake_file_rows_missing")
          declared: dict[str, tuple[str, int]] = {}
          for row in rows:
              if not isinstance(row, dict):
                  fail("intake_file_row_not_object")
              name = row.get("path")
              digest = row.get("sha256")
              size = row.get("size_bytes")
              if (
                  not isinstance(name, str)
                  or "/" in name
                  or name in {"", ".", ".."}
                  or name in declared
              ):
                  fail(f"intake_file_name_invalid: {name!r}")
              if not isinstance(digest, str) or re.fullmatch(
                  r"[0-9a-f]{64}",
                  digest,
              ) is None:
                  fail(f"intake_file_digest_invalid: {name!r}")
              if (
                  not isinstance(size, int)
                  or isinstance(size, bool)
                  or size <= 0
              ):
                  fail(f"intake_file_size_invalid: {name!r}")
              candidate = intake / name
              if not candidate.is_file() or candidate.is_symlink():
                  fail(f"intake_file_missing_or_symlinked: {name}")
              if candidate.stat().st_size != size:
                  fail(f"intake_file_size_mismatch: {name}")
              if sha256_file(candidate) != digest:
                  fail(f"intake_file_digest_mismatch: {name}")
              declared[name] = (digest, size)

          actual: set[str] = set()
          for candidate in intake.iterdir():
              if candidate.is_symlink() or not candidate.is_file():
                  fail(
                      "intake_directory_contains_nonregular_entry: "
                      f"{candidate.name!r}"
                  )
              actual.add(candidate.name)
          expected_actual = set(declared) | {
              "candidate-bundle-intake-report.json"
          }
          if actual != expected_actual:
              fail(
                  "intake_directory_closure_mismatch: "
                  f"missing={sorted(expected_actual - actual)!r} "
                  f"unexpected={sorted(actual - expected_actual)!r}"
              )

          release_candidate_id = subject.get("release_candidate_id")
          source_run_key = subject.get("source_run_key")
          source_updated_utc = subject.get("source_updated_utc")
          if (
              not isinstance(release_candidate_id, str)
              or not release_candidate_id
              or "\n" in release_candidate_id
              or "\r" in release_candidate_id
          ):
              fail("release_candidate_id_invalid")
          if (
              not isinstance(source_run_key, str)
              or not source_run_key
              or "\n" in source_run_key
              or "\r" in source_run_key
          ):
              fail("source_run_key_invalid")
          if not isinstance(source_updated_utc, str) or re.fullmatch(
              r"[0-9]{4}-[0-9]{2}-[0-9]{2}"
              r"T[0-9]{2}:[0-9]{2}:[0-9]{2}Z",
              source_updated_utc,
          ) is None:
              fail("source_updated_utc_invalid")

          outputs = {
              "intake_directory": str(intake),
              "intake_report_sha256": hashlib.sha256(report_bytes).hexdigest(),
              "intake_report_size_bytes": str(len(report_bytes)),
              "release_candidate_id": release_candidate_id,
              "source_run_attempt": str(source_run_attempt),
              "source_run_id": str(source_run_id),
              "source_run_key": source_run_key,
              "source_run_number": str(source_run_number),
              "source_updated_utc": source_updated_utc,
              "subject_revision": subject_revision,
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
              newline="\n",
          ) as stream:
              for key, value in outputs.items():
                  if (
                      not value
                      or "\n" in value
                      or "\r" in value
                  ):
                      fail(f"invalid_step_output: {key}")
                  stream.write(f"{key}={value}\n")
          PY

      - name: Checkout exact current-run source subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.intake.outputs.subject_revision }}
          path: subject-checkout
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          set-safe-directory: false

      - name: Verify exact independent subject and control-plane checkouts
        shell: bash
        env:
          SUBJECT_REVISION: ${{ steps.intake.outputs.subject_revision }}
          CONTROL_REVISION: ${{ steps.provider.outputs.control_plane_revision }}
        run: |
          set -euo pipefail

          SUBJECT_ROOT="${GITHUB_WORKSPACE}/subject-checkout"
          CONTROL_ROOT="${GITHUB_WORKSPACE}/control-plane-checkout"

          test "$(git -C "${SUBJECT_ROOT}" rev-parse HEAD)" = "${SUBJECT_REVISION}"
          test "$(git -C "${CONTROL_ROOT}" rev-parse HEAD)" = "${CONTROL_REVISION}"
          test "$(realpath "${SUBJECT_ROOT}")" != "$(realpath "${CONTROL_ROOT}")"

          REQUIRED_SUBJECT_PATHS=(
            ".github/workflows/pulse_ci.yml"
            "pulse_gate_policy_v0.yml"
            "pulse_gate_registry_v0.yml"
            "PULSE_safe_pack_v0/tools/check_gates.py"
          )
          for relative in "${REQUIRED_SUBJECT_PATHS[@]}"; do
            candidate="${SUBJECT_ROOT}/${relative}"
            if [[ ! -f "${candidate}" || -L "${candidate}" ]]; then
              echo "::error::subject component missing or symlinked: ${relative}"
              exit 1
            fi
          done

      - name: Build checksum-closed artifact-observed proof
        id: proof
        shell: bash
        env:
