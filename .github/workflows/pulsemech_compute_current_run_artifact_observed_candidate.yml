          PRODUCER_RUN_KEY="GITHUB_RUN_ID=${GITHUB_RUN_ID}|GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}|GITHUB_WORKFLOW=${GITHUB_WORKFLOW}|JOB=artifact-observed-proof"
          CI_IDENTITY="${GITHUB_WORKFLOW}/${GITHUB_JOB}/artifact-observed-proof"

          python -I \
            "${CONTROL_ROOT}/tools/build_pulsemech_compute_current_run_artifact_observed_proof_v0.py" \
            --intake-directory "${INTAKE_DIRECTORY}" \
            --subject-root "${SUBJECT_ROOT}" \
            --subject-repository "${GITHUB_REPOSITORY}" \
            --subject-revision "${SUBJECT_REVISION}" \
            --control-plane-root "${CONTROL_ROOT}" \
            --control-plane-repository "${GITHUB_REPOSITORY}" \
            --control-plane-revision "${CONTROL_REVISION}" \
            --analysis-run-key "${ANALYSIS_RUN_KEY}" \
            --producer-run-key "${PRODUCER_RUN_KEY}" \
            --ci-workflow-or-job-identity "${CI_IDENTITY}" \
            --output-directory "${PROOF_DIRECTORY}" \
            > "${STDOUT_PATH}"

          cmp --silent \
            "${STDOUT_PATH}" \
            "${PROOF_DIRECTORY}/artifact-observed-proof-manifest.json"

          PROOF_DIRECTORY="${PROOF_DIRECTORY}" \
          INTAKE_DIRECTORY="${INTAKE_DIRECTORY}" \
          SUBJECT_REVISION="${SUBJECT_REVISION}" \
          SOURCE_RUN_ID="${SOURCE_RUN_ID}" \
          SOURCE_RUN_NUMBER="${SOURCE_RUN_NUMBER}" \
          SOURCE_RUN_ATTEMPT="${SOURCE_RUN_ATTEMPT}" \
          SOURCE_RUN_KEY="${SOURCE_RUN_KEY}" \
          CONTROL_REVISION="${CONTROL_REVISION}" \
          PROVIDER_RUN_ID="${PROVIDER_RUN_ID}" \
          PROVIDER_RUN_ATTEMPT="${PROVIDER_RUN_ATTEMPT}" \
