          def fail(message: str) -> None:
              raise SystemExit(f"artifact_observed_proof_invalid: {message}")


          def reject_duplicate_keys(
              pairs: list[tuple[str, Any]],
          ) -> dict[str, Any]:
              result: dict[str, Any] = {}
              for key, value in pairs:
                  if key in result:
                      fail(f"duplicate_json_key: {key!r}")
                  result[key] = value
