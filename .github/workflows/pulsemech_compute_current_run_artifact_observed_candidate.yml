          expected_top = {
              "authority_boundary",
              "content_boundary",
              "document_type",
              "errors",
              "input_bindings",
              "ok",
              "output_layout",
              "plan_generation",
              "producer",
              "proof_identity",
              "record_status",
              "result",
              "schema_version",
              "subject",
              "trusted_control_plane",
          }
          if set(manifest) != expected_top:
              fail("proof_manifest_top_level_keys_mismatch")
          if manifest.get("schema_version") != (
              "pulsemech_compute_current_run_artifact_observed_proof_v0"
          ):
              fail("proof_manifest_schema_version_mismatch")
          if manifest.get("document_type") != (
              "pulsemech_compute_current_run_artifact_observed_proof"
          ):
              fail("proof_manifest_document_type_mismatch")
          if (
              manifest.get("record_status") != "observed"
              or manifest.get("ok") is not True
              or manifest.get("errors") != []
          ):
              fail("proof_manifest_not_successful_observed")

          expected_authority = {
              "activates_compute_gate": False,
              "candidate_only": True,
              "changes_gate_policy": False,
              "changes_gate_semantics": False,
              "changes_release_authority": False,
              "creates_compute_budget": False,
              "creates_gate_result": False,
              "creates_release_decision": False,
              "materializes_active_gate_state": False,
              "mutates_subject_run": False,
              "non_active": True,
              "proof_is_release_authority": False,
              "produces_runtime_observation": False,
              "write_mode": "external_proof_bundle_only",
              "writes_subject_status": False,
              "writes_target_repository": False,
          }
          expected_content = {
              "analysis_level": "artifact_observed",
              "candidate_values_may_be_false": True,
              "contains_compute_budget": False,
              "contains_resource_measurement": False,
              "contains_runtime_observation": False,
              "contains_secret_material": False,
              "missing_and_unresolved_states_preserved": True,
              "raw_model_inputs_included": False,
              "raw_model_outputs_included": False,
          }
          if manifest.get("authority_boundary") != expected_authority:
              fail("proof_authority_boundary_mismatch")
          if manifest.get("content_boundary") != expected_content:
              fail("proof_content_boundary_mismatch")

          trusted = manifest.get("trusted_control_plane")
          if not isinstance(trusted, dict) or trusted != {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "revision": os.environ["CONTROL_REVISION"],
              "separate_from_subject_checkout": True,
              "subject_may_select_revision": False,
              "trust_mode": "protected_exact_revision",
          }:
              fail("trusted_control_plane_binding_mismatch")

          subject = manifest.get("subject")
          if not isinstance(subject, dict):
              fail("proof_subject_not_object")
          exact_subject = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["SUBJECT_REVISION"],
              "subject_run_key": os.environ["SOURCE_RUN_KEY"],
              "workflow_name": "PULSE CI",
              "workflow_run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
              "workflow_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "workflow_run_number": int(os.environ["SOURCE_RUN_NUMBER"]),
          }
          for field, expected in exact_subject.items():
              if subject.get(field) != expected:
                  fail(
                      f"proof_subject_{field}_mismatch: "
                      f"expected={expected!r} actual={subject.get(field)!r}"
                  )

          result = manifest.get("result")
          if not isinstance(result, dict):
              fail("proof_result_not_object")
          if result.get("analysis_level") != "artifact_observed":
              fail("proof_result_analysis_level_mismatch")
          gates = result.get("candidate_gates")
          expected_gate_ids = {
              "compute_transition_path_complete",
              "compute_transition_authority_binding_ok",
              "compute_transition_unbound_mutation_absent",
          }
          if (
              not isinstance(gates, dict)
              or set(gates) != expected_gate_ids
              or any(type(value) is not bool for value in gates.values())
          ):
              fail("proof_candidate_gate_map_invalid")
          if result.get("candidate_all_true") is not all(gates.values()):
              fail("proof_candidate_all_true_mismatch")
          if result.get("candidate_gate_set") != (
              "compute_planned_observed_relation_candidate"
          ):
              fail("proof_candidate_gate_set_mismatch")
          if result.get("relation_comparison_status") not in {
              "complete",
              "partial",
              "unknown",
          }:
              fail("proof_relation_comparison_status_invalid")
          if not isinstance(result.get("unresolved_reasons"), list):
              fail("proof_unresolved_reasons_not_array")

          layout = manifest.get("output_layout")
          if not isinstance(layout, dict):
              fail("proof_output_layout_not_object")
          if layout.get("manifest_scope") != (
              "all_proof_files_except_this_manifest"
          ):
              fail("proof_manifest_scope_mismatch")
          if layout.get("proof_manifest_path") != MANIFEST_NAME:
              fail("proof_manifest_path_mismatch")
          rows = layout.get("files")
          if (
              not isinstance(rows, list)
              or layout.get("file_count") != len(PAYLOAD_NAMES)
              or len(rows) != len(PAYLOAD_NAMES)
          ):
              fail("proof_output_file_count_mismatch")

          declared: dict[str, tuple[str, int]] = {}
          for row in rows:
              if not isinstance(row, dict) or set(row) != {
                  "path",
                  "sha256",
                  "size_bytes",
              }:
                  fail("proof_output_file_row_invalid")
              name = row.get("path")
              digest = row.get("sha256")
              size = row.get("size_bytes")
              if (
                  name not in PAYLOAD_NAMES
                  or name in declared
                  or not isinstance(digest, str)
                  or re.fullmatch(r"[0-9a-f]{64}", digest) is None
                  or not isinstance(size, int)
                  or isinstance(size, bool)
                  or size <= 0
              ):
                  fail(f"proof_output_file_identity_invalid: {name!r}")
              candidate = proof / str(name)
              if not candidate.is_file() or candidate.is_symlink():
                  fail(f"proof_output_file_missing_or_symlinked: {name}")
              if candidate.stat().st_size != size:
                  fail(f"proof_output_file_size_mismatch: {name}")
              if sha256_file(candidate) != digest:
                  fail(f"proof_output_file_digest_mismatch: {name}")
              declared[str(name)] = (digest, size)
          if set(declared) != PAYLOAD_NAMES:
              fail("proof_output_file_set_mismatch")

          actual: set[str] = set()
          for candidate in proof.iterdir():
              if candidate.is_symlink() or not candidate.is_file():
                  fail(
                      "proof_directory_contains_nonregular_entry: "
                      f"{candidate.name!r}"
                  )
              actual.add(candidate.name)
          expected_actual = PAYLOAD_NAMES | {MANIFEST_NAME}
          if actual != expected_actual:
              fail(
                  "proof_directory_closure_mismatch: "
                  f"missing={sorted(expected_actual - actual)!r} "
                  f"unexpected={sorted(actual - expected_actual)!r}"
              )

          intake_binding = manifest.get("input_bindings")
          if not isinstance(intake_binding, dict):
              fail("proof_input_bindings_not_object")
          intake_report_binding = intake_binding.get(
              "candidate_bundle_intake_report"
          )
          if not isinstance(intake_report_binding, dict):
              fail("proof_intake_report_binding_not_object")
          intake_report_path = (
              intake / "candidate-bundle-intake-report.json"
          )
          if intake_report_binding != {
              "path": "candidate-bundle-intake-report.json",
              "sha256": sha256_file(intake_report_path),
              "size_bytes": intake_report_path.stat().st_size,
          }:
              fail("proof_intake_report_binding_mismatch")

          producer = manifest.get("producer")
          if not isinstance(producer, dict):
              fail("proof_producer_not_object")
          if (
              producer.get("producer_source_revision")
              != os.environ["CONTROL_REVISION"]
          ):
              fail("proof_producer_revision_mismatch")
          if producer.get("producer_source") != (
              "tools/"
              "build_pulsemech_compute_current_run_artifact_observed_proof_v0.py"
          ):
              fail("proof_producer_source_mismatch")

          artifact_name = (
              "pulsemech-compute-current-run-artifact-observed-candidate-"
              f"{os.environ['SOURCE_RUN_ID']}-"
              f"{os.environ['SOURCE_RUN_ATTEMPT']}-provider-"
              f"{os.environ['PROVIDER_RUN_ID']}-"
              f"{os.environ['PROVIDER_RUN_ATTEMPT']}"
          )
          outputs = {
              "artifact_name": artifact_name,
              "proof_directory": str(proof),
              "proof_manifest_sha256": hashlib.sha256(
                  manifest_bytes
              ).hexdigest(),
              "proof_manifest_size_bytes": str(len(manifest_bytes)),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
              newline="\n",
          ) as stream:
              for key, value in outputs.items():
                  if not value or "\n" in value or "\r" in value:
                      fail(f"invalid_step_output: {key}")
                  stream.write(f"{key}={value}\n")
          PY

      - name: Reverify provider, checkouts, intake, and proof bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_RUN_ID: ${{ steps.provider.outputs.provider_run_id }}
          PROVIDER_RUN_NUMBER: ${{ steps.provider.outputs.provider_run_number }}
          PROVIDER_RUN_ATTEMPT: ${{ steps.provider.outputs.provider_run_attempt }}
          PROVIDER_REVISION: ${{ steps.provider.outputs.provider_revision }}
          PROVIDER_UPDATED_UTC: ${{ steps.provider.outputs.provider_updated_utc }}
          PROVIDER_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          PROVIDER_ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
          PROVIDER_ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
          PROVIDER_ARTIFACT_SIZE: ${{ steps.artifact.outputs.artifact_size_bytes }}
          PROVIDER_ARTIFACT_CREATED_UTC: ${{ steps.artifact.outputs.artifact_created_utc }}
          PROVIDER_ARTIFACT_EXPIRES_UTC: ${{ steps.artifact.outputs.artifact_expires_utc }}
          ENVELOPE_PATH: ${{ steps.download.outputs.envelope_path }}
          INTAKE_DIRECTORY: ${{ steps.intake.outputs.intake_directory }}
          SUBJECT_REVISION: ${{ steps.intake.outputs.subject_revision }}
          SOURCE_RUN_ID: ${{ steps.intake.outputs.source_run_id }}
          SOURCE_RUN_NUMBER: ${{ steps.intake.outputs.source_run_number }}
          SOURCE_RUN_ATTEMPT: ${{ steps.intake.outputs.source_run_attempt }}
          SOURCE_RUN_KEY: ${{ steps.intake.outputs.source_run_key }}
          CONTROL_REVISION: ${{ steps.provider.outputs.control_plane_revision }}
          PROOF_DIRECTORY: ${{ steps.proof.outputs.proof_directory }}
          PROOF_MANIFEST_SHA256: ${{ steps.proof.outputs.proof_manifest_sha256 }}
          PROOF_MANIFEST_SIZE: ${{ steps.proof.outputs.proof_manifest_size_bytes }}
        run: |
          set -euo pipefail

          SUBJECT_ROOT="${GITHUB_WORKSPACE}/subject-checkout"
          CONTROL_ROOT="${GITHUB_WORKSPACE}/control-plane-checkout"
          test "$(git -C "${SUBJECT_ROOT}" rev-parse HEAD)" = "${SUBJECT_REVISION}"
          test "$(git -C "${CONTROL_ROOT}" rev-parse HEAD)" = "${CONTROL_REVISION}"
          test "$(realpath "${SUBJECT_ROOT}")" != "$(realpath "${CONTROL_ROOT}")"

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          from pathlib import Path
          from typing import Any


          MAX_RESPONSE = int(os.environ["MAX_GITHUB_JSON_BYTES"])


          def fail(message: str) -> None:
              raise SystemExit(f"final_step3g_reverification_failed: {message}")


          def reject_duplicate_keys(
              pairs: list[tuple[str, Any]],
          ) -> dict[str, Any]:
              result: dict[str, Any] = {}
              for key, value in pairs:
                  if key in result:
                      fail(f"duplicate_json_key: {key!r}")
                  result[key] = value
              return result


          def gh_json(endpoint: str) -> dict[str, Any]:
              try:
                  result = subprocess.run(
                      [
                          "gh",
                          "api",
                          "-H",
                          "Accept: application/vnd.github+json",
                          "-H",
                          "X-GitHub-Api-Version: 2022-11-28",
                          endpoint,
                      ],
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=False,
                      timeout=60,
                      env={
                          "GH_TOKEN": os.environ["GH_TOKEN"],
                          "LANG": "C",
                          "LC_ALL": "C",
                          "PATH": os.environ.get("PATH", ""),
                      },
                  )
              except (OSError, subprocess.TimeoutExpired) as exc:
                  fail(f"gh_api_execution_failed endpoint={endpoint!r}: {exc}")
              if len(result.stdout) > MAX_RESPONSE:
                  fail(
                      f"gh_api_stdout_too_large endpoint={endpoint!r} "
                      f"size={len(result.stdout)} maximum={MAX_RESPONSE}"
                  )
              if len(result.stderr) > MAX_RESPONSE:
                  fail(
                      f"gh_api_stderr_too_large endpoint={endpoint!r} "
                      f"size={len(result.stderr)} maximum={MAX_RESPONSE}"
                  )
              if result.returncode != 0:
                  detail = result.stderr.decode("utf-8", errors="replace")
                  fail(
                      f"gh_api_failed endpoint={endpoint!r} "
                      f"returncode={result.returncode} detail={detail!r}"
                  )
              try:
                  value = json.loads(
                      result.stdout.decode("utf-8", errors="strict"),
                      object_pairs_hook=reject_duplicate_keys,
                  )
              except Exception as exc:
                  fail(f"gh_api_invalid_json endpoint={endpoint!r}: {exc}")
              if not isinstance(value, dict):
                  fail(f"gh_api_not_object endpoint={endpoint!r}")
              return value


          def render(value: Any) -> bytes:
              return (
                  json.dumps(
                      value,
                      indent=2,
                      ensure_ascii=False,
                      sort_keys=True,
                      allow_nan=False,
                  )
                  + "\n"
              ).encode("utf-8")


          def parse(path: Path, *, label: str) -> tuple[dict[str, Any], bytes]:
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode):
                  fail(f"{label}_not_regular_non_symlink")
              raw = path.read_bytes()
              try:
                  value = json.loads(
                      raw.decode("utf-8", errors="strict"),
                      object_pairs_hook=reject_duplicate_keys,
                  )
              except Exception as exc:
                  fail(f"{label}_invalid_json: {exc}")
              if not isinstance(value, dict):
                  fail(f"{label}_not_object")
              if raw != render(value):
                  fail(f"{label}_not_canonical_json")
              return value, raw


          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          repository = os.environ["GITHUB_REPOSITORY"]
          provider_run_id = int(os.environ["PROVIDER_RUN_ID"])
          run = gh_json(
              f"/repos/{repository}/actions/runs/{provider_run_id}"
          )
          expected_run = {
              "id": provider_run_id,
              "name": "PULSEmech compute current-run export candidate",
              "path": (
                  ".github/workflows/"
                  "pulsemech_compute_current_run_export_candidate.yml"
              ),
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "success",
              "head_branch": "main",
              "head_sha": os.environ["PROVIDER_REVISION"],
              "run_number": int(os.environ["PROVIDER_RUN_NUMBER"]),
              "run_attempt": int(os.environ["PROVIDER_RUN_ATTEMPT"]),
              "updated_at": os.environ["PROVIDER_UPDATED_UTC"],
          }
          for field, expected in expected_run.items():
              if run.get(field) != expected:
                  fail(
                      f"provider_run_{field}_mismatch: "
                      f"expected={expected!r} actual={run.get(field)!r}"
                  )
          for field in ("repository", "head_repository"):
              record = run.get(field)
              if (
                  not isinstance(record, dict)
                  or record.get("full_name") != repository
              ):
                  fail(f"provider_run_{field}_repository_mismatch")

          workflow_id = run.get("workflow_id")
          if (
              not isinstance(workflow_id, int)
              or isinstance(workflow_id, bool)
              or workflow_id <= 0
          ):
              fail(f"provider_workflow_id_invalid: {workflow_id!r}")
          workflow = gh_json(
              f"/repos/{repository}/actions/workflows/{workflow_id}"
          )
          if (
              workflow.get("name")
              != "PULSEmech compute current-run export candidate"
              or workflow.get("path")
              != (
                  ".github/workflows/"
                  "pulsemech_compute_current_run_export_candidate.yml"
              )
              or workflow.get("state") != "active"
          ):
              fail("provider_workflow_identity_or_state_changed")

          listing = gh_json(
              f"/repos/{repository}/actions/runs/{provider_run_id}"
              "/artifacts?per_page=100"
          )
          rows = listing.get("artifacts")
          total = listing.get("total_count")
          if (
              not isinstance(rows, list)
              or not isinstance(total, int)
              or isinstance(total, bool)
              or total != len(rows)
          ):
              fail("provider_artifact_listing_not_closed")
          selected = [
              row
              for row in rows
              if isinstance(row, dict)
              and row.get("id") == int(os.environ["PROVIDER_ARTIFACT_ID"])
          ]
          if len(selected) != 1:
              fail("provider_artifact_id_not_unique")
          artifact = selected[0]
          expected_artifact = {
              "id": int(os.environ["PROVIDER_ARTIFACT_ID"]),
              "name": os.environ["PROVIDER_ARTIFACT_NAME"],
              "size_in_bytes": int(os.environ["PROVIDER_ARTIFACT_SIZE"]),
              "digest": f"sha256:{os.environ['PROVIDER_ARTIFACT_SHA256']}",
              "created_at": os.environ["PROVIDER_ARTIFACT_CREATED_UTC"],
              "expires_at": os.environ["PROVIDER_ARTIFACT_EXPIRES_UTC"],
              "expired": False,
          }
          for field, expected in expected_artifact.items():
              if artifact.get(field) != expected:
                  fail(
                      f"provider_artifact_{field}_mismatch: "
                      f"expected={expected!r} actual={artifact.get(field)!r}"
                  )

          envelope = Path(os.environ["ENVELOPE_PATH"])
          if not envelope.is_file() or envelope.is_symlink():
              fail("provider_envelope_missing_or_symlinked")
          if envelope.stat().st_size != int(
              os.environ["PROVIDER_ARTIFACT_SIZE"]
          ):
              fail("provider_envelope_size_changed")
          if sha256_file(envelope) != os.environ["PROVIDER_ARTIFACT_SHA256"]:
              fail("provider_envelope_digest_changed")

          intake = Path(os.environ["INTAKE_DIRECTORY"])
          intake_report_path = intake / "candidate-bundle-intake-report.json"
          intake_report, _ = parse(
              intake_report_path,
              label="intake_report",
          )
          if intake_report.get("ok") is not True:
              fail("intake_report_not_ok")
          source_subject = intake_report.get("source_subject")
          if not isinstance(source_subject, dict):
              fail("intake_source_subject_not_object")
          expected_subject = {
              "repository": repository,
              "source_run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_run_key": os.environ["SOURCE_RUN_KEY"],
              "source_run_number": int(os.environ["SOURCE_RUN_NUMBER"]),
              "subject_revision": os.environ["SUBJECT_REVISION"],
              "workflow_name": "PULSE CI",
              "workflow_path": ".github/workflows/pulse_ci.yml",
          }
          for field, expected in expected_subject.items():
              if source_subject.get(field) != expected:
                  fail(
                      f"intake_subject_{field}_changed: "
                      f"expected={expected!r} "
                      f"actual={source_subject.get(field)!r}"
                  )

          producer = intake_report.get("producer")
          if not isinstance(producer, dict):
              fail("intake_producer_not_object")
          loader_path = (
              Path(os.environ["GITHUB_WORKSPACE"])
              / "control-plane-checkout"
              / "tools"
              / "load_pulsemech_compute_current_run_export_candidate_bundle_v0.py"
          )
          if (
              producer.get("producer_source_revision")
              != os.environ["CONTROL_REVISION"]
              or producer.get("producer_source_sha256")
              != sha256_file(loader_path)
          ):
              fail("intake_producer_changed")

          intake_rows = intake_report.get("files")
          if not isinstance(intake_rows, list):
              fail("intake_file_rows_not_array")
          intake_declared: set[str] = set()
          for row in intake_rows:
              if not isinstance(row, dict):
                  fail("intake_file_row_not_object")
              name = row.get("path")
              if not isinstance(name, str) or name in intake_declared:
                  fail(f"intake_file_name_invalid_or_duplicate: {name!r}")
              candidate = intake / name
              if not candidate.is_file() or candidate.is_symlink():
                  fail(f"intake_file_missing_or_symlinked: {name}")
              if candidate.stat().st_size != row.get("size_bytes"):
                  fail(f"intake_file_size_changed: {name}")
              if sha256_file(candidate) != row.get("sha256"):
                  fail(f"intake_file_digest_changed: {name}")
              intake_declared.add(name)
          intake_actual: set[str] = set()
          for candidate in intake.iterdir():
              if candidate.is_symlink() or not candidate.is_file():
                  fail(
                      "intake_directory_contains_nonregular_entry: "
                      f"{candidate.name!r}"
                  )
              intake_actual.add(candidate.name)
          if intake_actual != intake_declared | {
              "candidate-bundle-intake-report.json"
          }:
              fail("intake_directory_closure_changed")

          proof = Path(os.environ["PROOF_DIRECTORY"])
          manifest_path = proof / "artifact-observed-proof-manifest.json"
          manifest, manifest_bytes = parse(
              manifest_path,
              label="proof_manifest",
          )
          if len(manifest_bytes) != int(os.environ["PROOF_MANIFEST_SIZE"]):
              fail("proof_manifest_size_changed")
          if hashlib.sha256(manifest_bytes).hexdigest() != os.environ[
              "PROOF_MANIFEST_SHA256"
          ]:
              fail("proof_manifest_digest_changed")

          expected_authority = {
              "activates_compute_gate": False,
              "candidate_only": True,
              "changes_gate_policy": False,
              "changes_gate_semantics": False,
              "changes_release_authority": False,
              "creates_compute_budget": False,
              "creates_gate_result": False,
              "creates_release_decision": False,
              "materializes_active_gate_state": False,
              "mutates_subject_run": False,
              "non_active": True,
              "proof_is_release_authority": False,
              "produces_runtime_observation": False,
              "write_mode": "external_proof_bundle_only",
              "writes_subject_status": False,
              "writes_target_repository": False,
          }
          if manifest.get("authority_boundary") != expected_authority:
              fail("proof_authority_boundary_changed")
          if (
              manifest.get("record_status") != "observed"
              or manifest.get("ok") is not True
              or manifest.get("errors") != []
          ):
              fail("proof_manifest_not_successful_observed")

          proof_producer = manifest.get("producer")
          if not isinstance(proof_producer, dict):
              fail("proof_producer_not_object")
          proof_builder_path = (
              Path(os.environ["GITHUB_WORKSPACE"])
              / "control-plane-checkout"
              / "tools"
              / "build_pulsemech_compute_current_run_artifact_observed_proof_v0.py"
          )
          if (
              proof_producer.get("producer_source_revision")
              != os.environ["CONTROL_REVISION"]
              or proof_producer.get("producer_source_sha256")
              != sha256_file(proof_builder_path)
          ):
              fail("proof_producer_changed")

          bundle_identity = intake_report.get("bundle_identity")
          if not isinstance(bundle_identity, dict):
              fail("intake_bundle_identity_not_object")
          carrier_name = bundle_identity.get("carrier_name")
          if (
              not isinstance(carrier_name, str)
              or not carrier_name.endswith(".zip")
              or "/" in carrier_name
          ):
              fail("intake_carrier_name_invalid")
          input_bindings = manifest.get("input_bindings")
          if not isinstance(input_bindings, dict):
              fail("proof_input_bindings_not_object")
          expected_input_bindings = {
              "candidate_bundle_intake_report": {
                  "path": "candidate-bundle-intake-report.json",
                  "sha256": sha256_file(intake_report_path),
                  "size_bytes": intake_report_path.stat().st_size,
              },
              "carrier": {
                  "path": carrier_name,
                  "sha256": sha256_file(intake / carrier_name),
                  "size_bytes": (intake / carrier_name).stat().st_size,
              },
              "expectation": {
                  "path": "expectation.json",
                  "sha256": sha256_file(intake / "expectation.json"),
                  "size_bytes": (intake / "expectation.json").stat().st_size,
              },
              "provider_binding": intake_report.get("provider_binding"),
              "subject_input_packet": {
                  "path": "subject-input-packet.json",
                  "sha256": sha256_file(
                      intake / "subject-input-packet.json"
                  ),
                  "size_bytes": (
                      intake / "subject-input-packet.json"
                  ).stat().st_size,
              },
          }
          if input_bindings != expected_input_bindings:
              fail("proof_input_bindings_changed")

          layout = manifest.get("output_layout")
          if not isinstance(layout, dict):
              fail("proof_output_layout_not_object")
          rows = layout.get("files")
          if not isinstance(rows, list):
              fail("proof_output_rows_not_array")
          declared: set[str] = set()
          for row in rows:
              if not isinstance(row, dict):
                  fail("proof_output_row_not_object")
              name = row.get("path")
              if not isinstance(name, str) or name in declared:
                  fail(f"proof_output_name_invalid_or_duplicate: {name!r}")
              candidate = proof / name
              if not candidate.is_file() or candidate.is_symlink():
                  fail(f"proof_output_missing_or_symlinked: {name}")
              if candidate.stat().st_size != row.get("size_bytes"):
                  fail(f"proof_output_size_changed: {name}")
              if sha256_file(candidate) != row.get("sha256"):
                  fail(f"proof_output_digest_changed: {name}")
              declared.add(name)
          proof_actual: set[str] = set()
          for candidate in proof.iterdir():
              if candidate.is_symlink() or not candidate.is_file():
                  fail(
                      "proof_directory_contains_nonregular_entry: "
                      f"{candidate.name!r}"
                  )
              proof_actual.add(candidate.name)
          if proof_actual != declared | {
              "artifact-observed-proof-manifest.json"
          }:
              fail("proof_directory_closure_changed")
          PY

      - name: Upload non-active artifact-observed candidate proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.proof.outputs.artifact_name }}
          path: ${{ steps.proof.outputs.proof_directory }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Record candidate-only artifact-observed result
        shell: bash
        env:
          ARTIFACT_NAME: ${{ steps.proof.outputs.artifact_name }}
          PROOF_MANIFEST_SHA256: ${{ steps.proof.outputs.proof_manifest_sha256 }}
          SOURCE_RUN_ID: ${{ steps.intake.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.intake.outputs.source_run_attempt }}
          PROVIDER_RUN_ID: ${{ steps.provider.outputs.provider_run_id }}
          PROVIDER_RUN_ATTEMPT: ${{ steps.provider.outputs.provider_run_attempt }}
        run: |
          set -euo pipefail

          {
            echo "## PULSEmech Step 3G artifact-observed candidate"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Role | Candidate-only artifact-observed proof |"
            echo "| Authority | Non-active / pre-authority / authority effect none |"
            echo "| Source PULSE CI run | \`${SOURCE_RUN_ID}\` / attempt \`${SOURCE_RUN_ATTEMPT}\` |"
            echo "| Step 3F provider run | \`${PROVIDER_RUN_ID}\` / attempt \`${PROVIDER_RUN_ATTEMPT}\` |"
            echo "| Uploaded artifact | \`${ARTIFACT_NAME}\` |"
            echo "| Proof manifest SHA-256 | \`${PROOF_MANIFEST_SHA256}\` |"
            echo
            echo "The uploaded bundle records artifact-observed analysis and separate"
            echo "candidate values. It does not activate a gate, create a compute"
            echo "budget, produce runtime observation, modify status.json, create a"
            echo "release decision, or change release authority."
          } >> "${GITHUB_STEP_SUMMARY}"
