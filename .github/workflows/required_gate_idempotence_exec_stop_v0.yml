name: PULSEmech original launcher exec-stop observation v0

# One owner-requested original-image checkpoint. No post-exec continuation.
on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: Exact reviewed main commit containing this workflow (40 lowercase hex digits).
        required: true
        type: string
      acknowledgement:
        description: Enter OBSERVE_ORIGINAL_LAUNCHER_EXEC_STOP_ONLY for this one bounded observation.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pulsemech-required-gate-idempotence-exec-stop-v0
  cancel-in-progress: false

jobs:
  acquire:
    name: Preserve one original launcher exec-stop attempt
    if: github.repository == 'HKati/pulse-release-gates-0.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.preserve.outputs.artifact-id }}
      receipt_sha256: ${{ steps.finalize.outputs.receipt_sha256 }}
      request_sha256: ${{ steps.finalize.outputs.request_sha256 }}
      capture_sha256: ${{ steps.finalize.outputs.capture_sha256 }}
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
      EXEC_STOP_ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
      EXEC_STOP_PHASE: acquire
    steps:
      - name: Require the exact owner and manual observation context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = HKati/pulse-release-gates-0.1
          test "$GITHUB_REPOSITORY_ID" = 1061766508
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = HKati
          test "$GITHUB_TRIGGERING_ACTOR" = HKati
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXEC_STOP_ACKNOWLEDGEMENT" = OBSERVE_ORIGINAL_LAUNCHER_EXEC_STOP_ONLY
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$EXPECTED_SOURCE_COMMIT" = "$GITHUB_SHA"
          test "$EXPECTED_SOURCE_COMMIT" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_WORKFLOW_REF" = HKati/pulse-release-gates-0.1/.github/workflows/required_gate_idempotence_exec_stop_v0.yml@refs/heads/main

      - name: Create the original attempt preservation prefix
        id: prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import json
          import os
          from pathlib import Path

          os.umask(0o077)
          root = Path(os.environ["RUNNER_TEMP"]) / (
              "required-gate-exec-stop-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          )
          root.mkdir(mode=0o700)
          record = {
              "format": "required_gate_idempotence_exec_stop_workflow_start_v0",
              "phase": "acquire",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_id": os.environ["GITHUB_REPOSITORY_ID"],
              "source_commit": os.environ["EXPECTED_SOURCE_COMMIT"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]), "run_attempt": 1,
              "event_name": os.environ["GITHUB_EVENT_NAME"], "ref": os.environ["GITHUB_REF"],
              "actor": os.environ["GITHUB_ACTOR"], "triggering_actor": os.environ["GITHUB_TRIGGERING_ACTOR"],
              "acknowledgement": os.environ["EXEC_STOP_ACKNOWLEDGEMENT"],
              "selected_runtime_executed": False, "authority_effect": "none",
          }
          with (root / "workflow-start.json").open("x", encoding="utf-8") as output:
              output.write(json.dumps(record, sort_keys=True, separators=(",", ":")) + "\n")
          PY

      - name: Checkout the exact reviewed observation implementation
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare the pinned environment and attempt the one selected checkpoint
        id: acquire
        shell: bash
        run: |
          set -euo pipefail
          observation_root="$RUNNER_TEMP/required-gate-exec-stop-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -I -B tools/required_gate_idempotence_exec_stop_hosted_v0.py acquire \
            --output-directory "$observation_root"

      - name: Bind the complete or incomplete preserved attempt
        id: finalize
        if: always() && steps.prefix.outcome == 'success' && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          observation_root="$RUNNER_TEMP/required-gate-exec-stop-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -I -B tools/required_gate_idempotence_exec_stop_hosted_v0.py finalize \
            --output-directory "$observation_root"

      - name: Preserve every available original attempt file
        id: preserve
        if: always() && steps.prefix.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: required-gate-idempotence-exec-stop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/required-gate-exec-stop-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          compression-level: 0
          retention-days: 90

  verify:
    name: Reconstruct the preserved attempt and attest completed verification
    needs: acquire
    if: always() && github.repository == 'HKati/pulse-release-gates-0.1' && needs.acquire.outputs.artifact_id != '' && needs.acquire.outputs.receipt_sha256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
      EXEC_STOP_ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
      EXEC_STOP_PHASE: verify
      EXEC_STOP_ARTIFACT_ID: ${{ needs.acquire.outputs.artifact_id }}
      EXPECTED_RECEIPT_SHA256: ${{ needs.acquire.outputs.receipt_sha256 }}
    steps:
      - name: Require the exact owner and current-run verification handoff
        id: context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = HKati/pulse-release-gates-0.1
          test "$GITHUB_REPOSITORY_ID" = 1061766508
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = HKati
          test "$GITHUB_TRIGGERING_ACTOR" = HKati
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXEC_STOP_ACKNOWLEDGEMENT" = OBSERVE_ORIGINAL_LAUNCHER_EXEC_STOP_ONLY
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXEC_STOP_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$EXPECTED_SOURCE_COMMIT" = "$GITHUB_SHA"
          test "$EXPECTED_SOURCE_COMMIT" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_WORKFLOW_REF" = HKati/pulse-release-gates-0.1/.github/workflows/required_gate_idempotence_exec_stop_v0.yml@refs/heads/main

      - name: Create a separate verification preservation prefix
        id: prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import json
          import os
          from pathlib import Path

          os.umask(0o077)
          root = Path(os.environ["RUNNER_TEMP"]) / (
              "required-gate-exec-stop-verification-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          )
          root.mkdir(mode=0o700)
          record = {
              "format": "required_gate_idempotence_exec_stop_workflow_start_v0",
              "phase": "verify",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_id": os.environ["GITHUB_REPOSITORY_ID"],
              "source_commit": os.environ["EXPECTED_SOURCE_COMMIT"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]), "run_attempt": 1,
              "event_name": os.environ["GITHUB_EVENT_NAME"], "ref": os.environ["GITHUB_REF"],
              "actor": os.environ["GITHUB_ACTOR"], "triggering_actor": os.environ["GITHUB_TRIGGERING_ACTOR"],
              "acknowledgement": os.environ["EXEC_STOP_ACKNOWLEDGEMENT"],
              "selected_runtime_executed": False, "authority_effect": "none",
          }
          with (root / "workflow-start.json").open("x", encoding="utf-8") as output:
              output.write(json.dumps(record, sort_keys=True, separators=(",", ":")) + "\n")
          PY

      - name: Checkout the exact independent verification implementation
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download only the preserved artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.acquire.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/required-gate-exec-stop-verification-${{ github.run_id }}-${{ github.run_attempt }}/input
          merge-multiple: true
          digest-mismatch: error

      - name: Independently reconstruct the original capture twice without acquisition
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          verification_root="$RUNNER_TEMP/required-gate-exec-stop-verification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -I -B tools/required_gate_idempotence_exec_stop_hosted_v0.py verify \
            --input-directory "$verification_root/input" \
            --receipt-sha256 "$EXPECTED_RECEIPT_SHA256" \
            --output-directory "$verification_root"

      - name: Attest the completed independently verified binding
        id: attest
        if: success() && steps.verify.outcome == 'success'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: ${{ runner.temp }}/required-gate-exec-stop-verification-${{ github.run_id }}-${{ github.run_attempt }}/verified-binding.json
          create-storage-record: false
          show-summary: true

      - name: Preserve and verify the original attestation bundle
        id: attest_verify
        if: success() && steps.attest.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
          EXEC_STOP_ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          EXEC_STOP_ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          EXEC_STOP_ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        shell: bash
        run: |
          set -euo pipefail
          verification_root="$RUNNER_TEMP/required-gate-exec-stop-verification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -I -B tools/required_gate_idempotence_exec_stop_hosted_v0.py attest-verify \
            --output-directory "$verification_root" --bundle "$EXEC_STOP_ATTESTATION_BUNDLE_PATH"

      - name: Preserve verification and signature evidence including failures
        if: always() && steps.prefix.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: required-gate-idempotence-exec-stop-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/required-gate-exec-stop-verification-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          compression-level: 0
          retention-days: 90

      - name: State the exact observation and authority boundary
        if: always() && steps.prefix.outcome == 'success'
        shell: bash
        run: |
          printf '%s\n' \
            'This workflow attempts one original-launcher kernel exec checkpoint and preserves the full available prefix.' \
            'The selected collector permits no continuation or detach after PTRACE_EVENT_EXEC.' \
            'The verification job reconstructs the uploaded original bytes without repeating acquisition.' \
            'Accepted reconstruction of an incomplete capture does not establish observation completion.' \
            'Inspect the source/run binding, exact environment inputs, original capture, two reports and attestation-verification result.' \
            'Selected-runtime execution, complete native closure, observed containment and release authority retain their separate obligations.' \
            'Steps 6 and 7 remain outstanding; authority_effect=none; keep #2879 open.' >> "$GITHUB_STEP_SUMMARY"
