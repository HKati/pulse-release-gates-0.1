name: Upload PULSE SARIF

on:
  workflow_run:
    workflows: ["PULSE CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: write

jobs:
  upload-sarif:
    if: github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted SARIF binding verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download pulse-report artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-report
          path: _pulse_artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify workflow-run and SARIF artifact binding
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python tools/check_sarif_workflow_run_binding_v0.py \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --artifact-root "_pulse_artifacts" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Checkout verified SARIF source commit
        if: steps.target.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: _pulse_sarif_source
          persist-credentials: false

      - name: Verify SARIF upload checkout identity
        if: steps.target.outputs.skip == 'false'
        shell: bash
        env:
          EXPECTED_SARIF_SHA: ${{ steps.target.outputs.sha }}
          SARIF_CHECKOUT_PATH: ${{ github.workspace }}/_pulse_sarif_source
        run: |
          set -euo pipefail

          actual_sha="$(git -C "$SARIF_CHECKOUT_PATH" rev-parse --verify HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SARIF_SHA" ]]; then
            printf '%s\n' '::error::SARIF upload checkout does not match verified target' >&2
            exit 1
          fi

      - name: Upload SARIF to GitHub code scanning
        if: steps.target.outputs.skip == 'false'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ steps.target.outputs.sarif_path }}
          # The upload action resolves commit_oid from this checkout's Git HEAD.
          checkout_path: ${{ github.workspace }}/_pulse_sarif_source
          ref: ${{ steps.target.outputs.ref }}
          sha: ${{ steps.target.outputs.sha }}
          category: pulse-gates
