name: Q2 reference preparation, qualification and capture v0

# Manual only. Preparation does not infer. Qualification permits exactly one
# fixed unscored diagnostic; capture has a separate explicit 150-slot consent.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Separate preparation, one unscored diagnostic, or the fixed 150-slot capture"
        required: true
        type: choice
        default: prepare-runtime
        options:
          - prepare-runtime
          - qualify-runtime
          - capture-reference
      confirm_diagnostic_retention:
        description: "Authorize one unscored diagnostic and retention of original token/text records in this Actions artifact"
        required: true
        default: false
        type: boolean
      confirm_capture_retention:
        description: "Authorize the fixed 150-call capture and retention of all original token/text records in this Actions artifact"
        required: true
        default: false
        type: boolean
      expected_source_sha:
        description: "Exact reviewed main commit (40 lowercase hex characters)"
        required: true
        type: string
      confirm_preparation:
        description: "Prepare model/wheel review candidates only; no model calls"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: q2-reference-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'HKati/pulse-release-gates-0.1'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MODE: ${{ inputs.mode }}
      CONFIRM_CAPTURE: ${{ inputs.confirm_capture_retention }}
      CONFIRM_DIAGNOSTIC: ${{ inputs.confirm_diagnostic_retention }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      CONFIRM_PREPARATION: ${{ inputs.confirm_preparation }}
    steps:
      - name: Check owner and exact dispatch context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = HKati
          test "$GITHUB_TRIGGERING_ACTOR" = HKati
          test "$GITHUB_RUN_ATTEMPT" = 1
          case "$MODE" in
            prepare-runtime)
              test "$CONFIRM_PREPARATION" = true
              test "$CONFIRM_DIAGNOSTIC" = false
              test "$CONFIRM_CAPTURE" = false
              ;;
            qualify-runtime)
              test "$CONFIRM_PREPARATION" = false
              test "$CONFIRM_DIAGNOSTIC" = true
              test "$CONFIRM_CAPTURE" = false
              ;;
            capture-reference)
              test "$CONFIRM_PREPARATION" = false
              test "$CONFIRM_DIAGNOSTIC" = false
              test "$CONFIRM_CAPTURE" = true
              ;;
            *) exit 1 ;;
          esac
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_WORKFLOW_SHA"

      - name: Checkout exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          # Historical preparation blobs are checked at their original commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up selected Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'

      - name: Stage exact model files and CPU wheel candidates
        if: inputs.mode == 'prepare-runtime'
        shell: bash
        run: |
          set -euo pipefail
          python -I PULSE_safe_pack_v0/tools/acquire_q2_reference_inputs_v0.py \
            prepare-runtime \
            --repo-root "$GITHUB_WORKSPACE" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --output-dir "$RUNNER_TEMP/q2-runtime-preparation"

      - name: Fix candidate digest before separate checking
        if: inputs.mode == 'prepare-runtime'
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum "$RUNNER_TEMP/q2-runtime-preparation/preparation.json" | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'preparation_sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Candidate preparation SHA-256: `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Independently verify bytes and resolve the lock offline
        if: inputs.mode == 'prepare-runtime'
        env:
          EXPECTED_PREPARATION_SHA256: ${{ steps.binding.outputs.preparation_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python -I PULSE_safe_pack_v0/tools/check_q2_reference_capture_v0.py \
            verify-prepared-runtime \
            --input-dir "$RUNNER_TEMP/q2-runtime-preparation" \
            --repo-root "$GITHUB_WORKSPACE" \
            --expected-preparation-sha256 "$EXPECTED_PREPARATION_SHA256" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/q2-runtime-preparation-check.json"

      - name: Preserve verified candidate for owner review
        if: inputs.mode == 'prepare-runtime'
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: q2-runtime-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/q2-runtime-preparation
            ${{ runner.temp }}/q2-runtime-preparation-check.json
          # The exact verified source closure includes source/.github/workflows/.
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 30

      - name: Record preparation boundary
        if: inputs.mode == 'prepare-runtime'
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '\nArtifact ID: `%s`\n' "$ARTIFACT_ID"
            printf 'Artifact digest: `%s`\n' "$ARTIFACT_DIGEST"
            printf '\nVerified review candidate only. No installation or model execution.\n'
            printf 'Native runtime qualification, capture and release admission remain pending.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Obtain the exact recorded runtime archive
        if: inputs.mode == 'qualify-runtime' || inputs.mode == 'capture-reference'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/q2-recorded-runtime.zip"
          test ! -e "$archive"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --retry 0 \
            --connect-timeout 15 --max-time 180 --max-filesize 508460811 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/HKati/pulse-release-gates-0.1/actions/artifacts/11282419957/zip" \
            --output "$archive"
          test "$(stat -c %s "$archive")" = 508460811
          printf '%s  %s\n' \
            b3a2b4db54816dd6f40171c221947d942ca63f3e9883f76de8455ad66037f4b9 \
            "$archive" | sha256sum --check --status

      - name: Qualify the native runtime with one fixed unscored diagnostic
        id: qualify
        if: inputs.mode == 'qualify-runtime'
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(python -c 'import os,sys; print(os.path.realpath(sys.executable))')"
          # TERM retains the 1200s execution cap; KILL bounds cleanup separately.
          # Service close: 2x10s + 5s; two watchdog stops: 2x15s.
          # The 180s grace leaves 125s for evidence inventory/publication.
          sudo --preserve-env=GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_ACTOR,GITHUB_TRIGGERING_ACTOR,GITHUB_RUN_ATTEMPT,GITHUB_SHA,GITHUB_WORKFLOW_SHA,GITHUB_WORKFLOW_REF,GITHUB_RUN_ID,ImageOS,ImageVersion \
            /usr/bin/timeout --signal=TERM --kill-after=180s 1200s \
            "$python_bin" -I -B PULSE_safe_pack_v0/tools/qualify_q2_reference_runtime_v0.py \
            qualify-runtime --repo-root "$GITHUB_WORKSPACE" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --archive "$RUNNER_TEMP/q2-recorded-runtime.zip" \
            --output-dir "$RUNNER_TEMP/q2-native-qualification" \
            --confirm-one-unscored-diagnostic

      - name: Preserve native diagnostic evidence including failures
        if: always() && inputs.mode == 'qualify-runtime' && steps.qualify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: q2-native-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/q2-native-qualification
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 30

      - name: Record the non-authorizing native boundary
        if: always() && inputs.mode == 'qualify-runtime' && steps.qualify.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'One fixed unscored diagnostic only. Read qualification.json and its separate checker evidence.' \
            'Failure or missing evidence is not qualification. No 150-call acquisition or Q2 gate admission.' \
            'All release requirements remain unchanged; #2879 stays open.' >> "$GITHUB_STEP_SUMMARY"

      - name: Capture the fixed 150-call reference and independently check extraction
        id: capture
        if: inputs.mode == 'capture-reference'
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(python -c 'import os,sys; print(os.path.realpath(sys.executable))')"
          sudo --preserve-env=GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_ACTOR,GITHUB_TRIGGERING_ACTOR,GITHUB_RUN_ATTEMPT,GITHUB_SHA,GITHUB_WORKFLOW_SHA,GITHUB_WORKFLOW_REF,GITHUB_RUN_ID,ImageOS,ImageVersion \
            /usr/bin/timeout --signal=TERM --kill-after=180s 1200s \
            "$python_bin" -I -B PULSE_safe_pack_v0/tools/acquire_q2_reference_inputs_v0.py \
            capture-reference --repo-root "$GITHUB_WORKSPACE" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --archive "$RUNNER_TEMP/q2-recorded-runtime.zip" \
            --output-dir "$RUNNER_TEMP/q2-reference-capture" \
            --confirm-capture-retention

      - name: Preserve original capture evidence including failures
        if: always() && inputs.mode == 'capture-reference' && steps.capture.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: q2-reference-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/q2-reference-capture
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          compression-level: 6
          retention-days: 30

      - name: Record the non-authorizing capture boundary
        if: always() && inputs.mode == 'capture-reference'
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'Fixed 150-slot capture only. Read capture.json, transcript.json, capture-check.json and reduction.json.\n'
            printf 'Acquisition completeness, verified extraction, metric PASS/FAIL and workflow outcome are separate.\n'
            printf 'A correct metric FAIL is retained without retry. Missing evidence is never complete capture.\n'
            printf 'No production admission, release authority or Step 5C acceptance. Keep #2879 open.\n'
          } >> "$GITHUB_STEP_SUMMARY"
